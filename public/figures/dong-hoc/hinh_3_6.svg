<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <marker id="arr-axis" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#64748b" />
    </marker>
  </defs>

  <!-- Bờ sông dưới y=250 và bờ trên y=90 -->
  <rect x="50" y="90" width="500" height="160" fill="#f0f9ff" />
  <line x1="50" y1="250" x2="550" y2="250" stroke="#0369a1" stroke-width="3" />
  <line x1="50" y1="90" x2="550" y2="90" stroke="#0369a1" stroke-width="3" />
  <text x="70" y="270" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">Bờ xuất phát (y = 0)</text>
  <text x="70" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">Bờ bên kia (y = h)</text>

  <!-- Chiều rộng sông h -->
  <line x1="530" y1="250" x2="530" y2="90" stroke="#64748b" stroke-width="1.5" />
  <line x1="525" y1="250" x2="535" y2="250" stroke="#64748b" stroke-width="1.5" />
  <line x1="525" y1="90" x2="535" y2="90" stroke="#64748b" stroke-width="1.5" />
  <text x="540" y="175" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569">h</text>

  <!-- Hệ trục Oxy gắn với bờ -->
  <line x1="160" y1="250" x2="420" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <line x1="160" y1="250" x2="160" y2="50" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <text x="425" y="254" font-family="sans-serif" font-size="13" font-style="italic" fill="#475569">x</text>
  <text x="150" y="45" font-family="sans-serif" font-size="13" font-style="italic" fill="#475569">y</text>
  <text x="145" y="265" font-family="sans-serif" font-size="13" fill="#475569">O</text>

  <!-- Vận tốc dòng nước v_e = u dọc theo trục x -->
  <line x1="160" y1="250" x2="270" y2="250" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)" />
  <text x="220" y="240" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0284c7">v_e = v</text>

  <!-- Vận tốc tương đối của thuyền v_r = u hướng góc alpha -->
  <line x1="160" y1="250" x2="220" y2="120" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="175" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">v_r = u</text>
  <!-- Góc alpha so với Oy -->
  <path d="M 160 190 A 60 60 0 0 1 185 195" fill="none" stroke="#64748b" stroke-width="1.2" />
  <text x="170" y="180" font-family="sans-serif" font-size="12" font-style="italic" fill="#475569">α</text>

  <!-- Vận tốc tuyệt đối v_a = v_r + v_e -->
  <line x1="160" y1="250" x2="330" y2="120" stroke="#10b981" stroke-width="2.8" marker-end="url(#arr-green)" />
  <text x="310" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981">v_a</text>
  <!-- Đường hình bình hành nét đứt -->
  <line x1="220" y1="120" x2="330" y2="120" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
  <line x1="270" y1="250" x2="330" y2="120" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
</svg>
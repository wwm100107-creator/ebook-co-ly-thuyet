<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <line x1="100" y1="140" x2="340" y2="140" stroke="#1e293b" stroke-width="3" />
  <circle cx="100" cy="140" r="5" fill="#0f172a" />
  <text x="85" y="165" class="lbl-bold">A</text>
  <circle cx="340" cy="140" r="5" fill="#0f172a" />
  <text x="345" y="165" class="lbl-bold">B</text>
  
  <line x1="100" y1="140" x2="170" y2="60" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="145" y="55" class="lbl-bold" fill="#2563eb">v<tspan font-size="12" dy="4">A</tspan></text><path d="M 145 37 h 12 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="170" y1="60" x2="170" y2="140" class="axis" />
  <line x1="100" y1="140" x2="170" y2="140" stroke="#dc2626" stroke-width="3" />
  <text x="120" y="125" class="lbl">&#945;</text>
  
  <line x1="340" y1="140" x2="410" y2="80" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="415" y="80" class="lbl-bold" fill="#2563eb">v<tspan font-size="12" dy="4">B</tspan></text><path d="M 415 62 h 12 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="410" y1="80" x2="410" y2="140" class="axis" />
  <line x1="340" y1="140" x2="410" y2="140" stroke="#dc2626" stroke-width="3" />
  <text x="360" y="125" class="lbl">&#946;</text>
  
  <text x="160" y="200" class="lbl-bold" fill="#dc2626">v<tspan font-size="12">A</tspan> cos&#945; = v<tspan font-size="12">B</tspan> cos&#946;</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="auto">
  <defs>
    <marker id="arr-axis" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#64748b" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Mặt đáy trụ hình elip z=0 -->
  <ellipse cx="250" cy="280" rx="120" ry="40" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- Trục tọa độ -->
  <line x1="250" y1="280" x2="250" y2="40" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <text x="255" y="35" font-family="sans-serif" font-size="13" font-style="italic" fill="#475569">z</text>
  <line x1="250" y1="280" x2="410" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <text x="415" y="284" font-family="sans-serif" font-size="13" font-style="italic" fill="#475569">x</text>
  <line x1="250" y1="280" x2="160" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <text x="150" y="340" font-family="sans-serif" font-size="13" font-style="italic" fill="#475569">y</text>
  <text x="238" y="295" font-family="sans-serif" font-size="13" fill="#475569">O</text>

  <!-- Mặt trụ bao quanh -->
  <line x1="130" y1="280" x2="130" y2="100" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2 2" />
  <line x1="370" y1="280" x2="370" y2="100" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2 2" />
  <ellipse cx="250" cy="100" rx="120" ry="40" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Đường đinh ốc helical path -->
  <path d="M 370 280 C 370 240, 130 220, 130 190 C 130 160, 370 140, 370 100" fill="none" stroke="#0284c7" stroke-width="2.8" />

  <!-- Điểm M trên đường đinh ốc -->
  <circle cx="280" cy="150" r="4.5" fill="#0f172a" />
  <text x="290" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">M</text>

  <!-- Vectơ vận tốc v -->
  <line x1="280" y1="150" x2="335" y2="115" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="340" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">v</text>

  <!-- Bán kính r -->
  <line x1="250" y1="280" x2="370" y2="280" stroke="#0284c7" stroke-width="1.8" />
  <text x="310" y="273" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0284c7">r</text>

  <!-- Bước đinh ốc h = 2*pi*p -->
  <line x1="390" y1="280" x2="390" y2="100" stroke="#475569" stroke-width="1.5" />
  <line x1="385" y1="280" x2="395" y2="280" stroke="#475569" stroke-width="1.5" />
  <line x1="385" y1="100" x2="395" y2="100" stroke="#475569" stroke-width="1.5" />
  <text x="400" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">h = 2πp</text>
</svg>
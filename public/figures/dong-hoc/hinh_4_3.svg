<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <ellipse cx="240" cy="160" rx="150" ry="70" class="solid" />
  <circle cx="150" cy="150" r="4.5" fill="#0f172a" />
  <text x="135" y="165" class="lbl-bold">A</text>
  
  <circle cx="310" cy="140" r="4.5" fill="#0f172a" />
  <text x="320" y="155" class="lbl-bold">B</text>
  
  <line x1="150" y1="150" x2="90" y2="100" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="75" y="95" class="lbl-bold" fill="#2563eb">v<tspan font-size="12" dy="4">A</tspan></text><path d="M 75 77 h 12 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="310" y1="140" x2="380" y2="100" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="385" y="95" class="lbl-bold" fill="#2563eb">v<tspan font-size="12" dy="4">B</tspan></text><path d="M 385 77 h 12 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="150" y1="150" x2="230" y2="30" stroke="#64748b" stroke-dasharray="4,3" />
  <line x1="310" y1="140" x2="230" y2="30" stroke="#64748b" stroke-dasharray="4,3" />
  
  <circle cx="230" cy="30" r="5" fill="#dc2626" />
  <text x="240" y="30" class="lbl-bold" fill="#dc2626">P (v<tspan font-size="12">P</tspan> = 0)</text>
</svg>
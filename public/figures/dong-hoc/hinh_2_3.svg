<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-sub { font-size: 13px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <!-- Bánh răng 1 bán kính R1 tâm O1 -->
  <circle cx="140" cy="130" r="75" class="solid" />
  <circle cx="140" cy="130" r="4.5" fill="#0f172a" />
  <text x="120" y="135" class="lbl-bold">O<tspan font-size="12">1</tspan></text>
  <line x1="140" y1="130" x2="140" y2="55" stroke="#64748b" stroke-dasharray="3,3" />
  <text x="145" y="95" class="lbl">R<tspan font-size="12">1</tspan></text>
  <path d="M 125 105 A 25 25 0 0 1 155 105" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="160" y="100" class="lbl-bold" fill="#2563eb">&#969;<tspan font-size="12">1</tspan></text>
  
  <!-- Bánh răng 2 bán kính R2 tâm O2 -->
  <circle cx="320" cy="130" r="105" class="solid" />
  <circle cx="320" cy="130" r="4.5" fill="#0f172a" />
  <text x="325" y="135" class="lbl-bold">O<tspan font-size="12">2</tspan></text>
  <line x1="320" y1="130" x2="320" y2="25" stroke="#64748b" stroke-dasharray="3,3" />
  <text x="325" y="80" class="lbl">R<tspan font-size="12">2</tspan></text>
  <path d="M 335 100 A 30 30 0 0 0 305 100" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="290" y="95" class="lbl-bold" fill="#2563eb">&#969;<tspan font-size="12">2</tspan></text>
  
  <!-- Điểm ăn khớp tiếp xúc P -->
  <circle cx="215" cy="130" r="5" fill="#dc2626" />
  <text x="205" y="120" class="lbl-bold" fill="#dc2626">P</text>
  
  <!-- Vận tốc vòng chung v tại P hướng xuống -->
  <line x1="215" y1="130" x2="215" y2="210" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="225" y="200" class="lbl-bold" fill="#dc2626">v&#8407;</text>
</svg>
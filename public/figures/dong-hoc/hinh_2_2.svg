<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <line x1="200" y1="280" x2="200" y2="25" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="185" y="25" class="lbl-bold">z</text>
  
  <rect x="185" y="230" width="30" height="20" fill="url(#hatch)" stroke="#64748b" />
  <rect x="185" y="60" width="30" height="20" fill="url(#hatch)" stroke="#64748b" />
  
  <ellipse cx="200" cy="150" rx="140" ry="50" class="solid" fill="#f1f5f9" />
  <circle cx="200" cy="150" r="4.5" fill="#0f172a" />
  <text x="185" y="165" class="lbl-bold">O</text>
  
  <circle cx="300" cy="150" r="4.5" fill="#2563eb" />
  <text x="310" y="145" class="lbl-bold">M</text>
  <line x1="200" y1="150" x2="300" y2="150" stroke="#64748b" stroke-width="1.8" />
  <text x="245" y="142" class="lbl-bold">R</text>
  
  <line x1="300" y1="150" x2="300" y2="75" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g>
    <text x="310" y="80" class="lbl-bold" fill="#dc2626">v = &#969;R</text>
    <path d="M 310 62 h 12 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" />
  </g>
  
  <path d="M 180 100 A 20 20 0 1 1 220 100" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <text x="225" y="105" class="lbl-bold" fill="#2563eb">&#969;</text>
</svg>
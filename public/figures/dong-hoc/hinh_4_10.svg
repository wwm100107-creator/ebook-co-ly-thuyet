<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Đường ray mặt sàn -->
  <line x1="50" y1="260" x2="550" y2="260" stroke="#334155" stroke-width="2.5" />
  <!-- Gạch chéo mặt đất -->
  <g stroke="#94a3b8" stroke-width="1.2">
    <line x1="70" y1="260" x2="55" y2="275" />
    <line x1="120" y1="260" x2="105" y2="275" />
    <line x1="170" y1="260" x2="155" y2="275" />
    <line x1="220" y1="260" x2="205" y2="275" />
    <line x1="270" y1="260" x2="255" y2="275" />
    <line x1="320" y1="260" x2="305" y2="275" />
    <line x1="370" y1="260" x2="355" y2="275" />
    <line x1="420" y1="260" x2="405" y2="275" />
    <line x1="470" y1="260" x2="455" y2="275" />
    <line x1="520" y1="260" x2="505" y2="275" />
  </g>

  <!-- Vành bánh xe tâm C (300, 160), bán kính R=100 -->
  <circle cx="300" cy="160" r="100" fill="#f8fafc" stroke="#0284c7" stroke-width="3" />
  <circle cx="300" cy="160" r="5" fill="#0284c7" />
  <text x="310" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284c7">C</text>

  <!-- Tâm vận tốc tức thời P (300, 260) -->
  <circle cx="300" cy="260" r="6" fill="#ef4444" />
  <text x="275" y="285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">P (v_P = 0)</text>

  <!-- Vận tốc tâm v_C ngang -->
  <line x1="300" y1="160" x2="400" y2="160" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="405" y="165" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">v_C = R·ω</text>

  <!-- Vận tốc đỉnh cao nhất A (300, 60): v_A = 2 v_C -->
  <circle cx="300" cy="60" r="4.5" fill="#0f172a" />
  <text x="300" y="50" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>
  <line x1="300" y1="60" x2="480" y2="60" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="485" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">v_A = 2v_C</text>

  <!-- Điểm M bất kỳ trên vành (x=370, y=89) -->
  <circle cx="371" cy="89" r="4.5" fill="#0f172a" />
  <text x="380" y="85" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">M</text>
  <!-- Nối PM nét đứt -->
  <line x1="300" y1="260" x2="371" y2="89" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- Vectơ v_M vuông góc PM -->
  <line x1="371" y1="89" x2="475" y2="132" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="480" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">v_M</text>

  <!-- Chiều quay omega -->
  <path d="M 270 110 A 60 60 0 0 1 330 110" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="340" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284c7">ω</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <g transform="translate(40, 40)">
    <ellipse cx="80" cy="80" rx="60" ry="40" class="solid" />
    <circle cx="55" cy="70" r="4" fill="#0f172a" />
    <text x="40" y="70" class="lbl-bold">A</text>
    <circle cx="105" cy="90" r="4" fill="#0f172a" />
    <text x="110" y="105" class="lbl-bold">B</text>
    <line x1="55" y1="70" x2="105" y2="90" stroke="#1e293b" stroke-width="2" />
  </g>
  
  <g transform="translate(240, 40)">
    <ellipse cx="80" cy="80" rx="60" ry="40" class="solid" />
    <circle cx="55" cy="70" r="4" fill="#0f172a" />
    <text x="40" y="70" class="lbl-bold">A'</text>
    <circle cx="105" cy="90" r="4" fill="#0f172a" />
    <text x="110" y="105" class="lbl-bold">B'</text>
    <line x1="55" y1="70" x2="105" y2="90" stroke="#1e293b" stroke-width="2" />
  </g>
  
  <path d="M 95 110 C 140 160, 240 160, 295 110" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-blue)" />
  <path d="M 145 130 C 190 180, 290 180, 345 130" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-blue)" />
  
  <line x1="95" y1="110" x2="150" y2="135" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g><text x="140" y="160" class="lbl-bold" fill="#dc2626">v<tspan font-size="12" dy="4">A</tspan></text><path d="M 140 142 h 12 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="145" y1="130" x2="200" y2="155" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g><text x="195" y="180" class="lbl-bold" fill="#dc2626">v<tspan font-size="12" dy="4">B</tspan></text><path d="M 195 162 h 12 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
</svg>
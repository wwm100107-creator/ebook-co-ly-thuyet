<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" width="100%" height="auto">
  <defs>
    <marker id="arr-axis" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#64748b" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Khớp cố định O1(140, 240) và O2(460, 240) -->
  <circle cx="140" cy="240" r="5" fill="#0f172a" />
  <text x="120" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O₁</text>
  <circle cx="460" cy="240" r="5" fill="#0f172a" />
  <text x="470" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O₂</text>

  <!-- Khâu cố định l1 = O1 O2 -->
  <line x1="140" y1="240" x2="460" y2="240" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" />
  <text x="295" y="260" font-family="sans-serif" font-size="13" font-style="italic" fill="#64748b">l₁</text>

  <!-- Khâu dẫn l2: O1 A. A(200, 110) -->
  <line x1="140" y1="240" x2="200" y2="110" stroke="#0284c7" stroke-width="3.5" />
  <circle cx="200" cy="110" r="5" fill="#0284c7" />
  <text x="185" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284c7">A</text>
  <text x="155" y="170" font-family="sans-serif" font-size="13" font-style="italic" fill="#0284c7">l₂ (khâu 2)</text>

  <!-- Khâu bị dẫn l4: O2 B. B(410, 90) -->
  <line x1="460" y1="240" x2="410" y2="90" stroke="#0284c7" stroke-width="3.5" />
  <circle cx="410" cy="90" r="5" fill="#0284c7" />
  <text x="420" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284c7">B</text>
  <text x="450" y="165" font-family="sans-serif" font-size="13" font-style="italic" fill="#0284c7">l₄ (khâu 4)</text>

  <!-- Khâu truyền AB (khâu 3) l3 -->
  <line x1="200" y1="110" x2="410" y2="90" stroke="#0369a1" stroke-width="3.5" />
  <text x="300" y="85" font-family="sans-serif" font-size="13" font-style="italic" fill="#0369a1">l₃ (khâu 3)</text>

  <!-- Điểm K gắn liền trên khâu 3 tạo thành tam giác ABK -->
  <!-- K(280, 40) -->
  <polygon points="200 110, 410 90, 280 40" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="280" cy="40" r="4.5" fill="#ef4444" />
  <text x="285" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">K</text>

  <!-- Các góc định vị phi 2, phi 3, phi 4 -->
  <line x1="140" y1="240" x2="220" y2="240" stroke="#94a3b8" stroke-width="1.2" />
  <path d="M 175 240 A 35 35 0 0 0 158 200" fill="none" stroke="#ef4444" stroke-width="1.5" />
  <text x="175" y="220" font-family="sans-serif" font-size="12" font-style="italic" fill="#ef4444">φ₂</text>
</svg>
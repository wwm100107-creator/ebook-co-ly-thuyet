<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <marker id="arr-axis" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#64748b" />
    </marker>
  </defs>

  <!-- Hệ trục Oxy -->
  <line x1="50" y1="260" x2="550" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <line x1="70" y1="280" x2="70" y2="40" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <text x="555" y="264" font-family="sans-serif" font-size="13" font-style="italic" fill="#475569">x</text>
  <text x="65" y="35" font-family="sans-serif" font-size="13" font-style="italic" fill="#475569">y</text>
  <text x="55" y="275" font-family="sans-serif" font-size="13" fill="#475569">O</text>

  <!-- Quỹ đạo parabol từ O(70, 260) qua đỉnh(290, 90) đến rơi(510, 260) -->
  <path d="M 70 260 Q 290 -80 510 260" fill="none" stroke="#0284c7" stroke-width="2.5" />

  <!-- Vecto v0 tại gốc -->
  <line x1="70" y1="260" x2="140" y2="150" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="145" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">v₀</text>
  <!-- Cung góc alpha -->
  <path d="M 105 260 A 35 35 0 0 0 95 220" fill="none" stroke="#64748b" stroke-width="1.2" />
  <text x="110" y="240" font-family="sans-serif" font-size="12" font-style="italic" fill="#475569">α</text>

  <!-- Đỉnh parabol H(290, 90) -->
  <circle cx="290" cy="95" r="4.5" fill="#0f172a" />
  <text x="290" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">H (đỉnh)</text>
  <line x1="290" y1="95" x2="350" y2="95" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="355" y="99" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444">v<tspan font-size="9" dy="3">H</tspan><tspan dy="-3"> = v₀ cosα</tspan></text>
  <line x1="290" y1="95" x2="290" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="295" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981">g = a<tspan font-size="9" dy="3">n</tspan></text>

  <!-- Điểm M bất kỳ trên nhánh đi xuống (390, 145) -->
  <circle cx="390" cy="145" r="4.5" fill="#0f172a" />
  <text x="400" y="138" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">M</text>
  <!-- Vận tốc v tiếp tuyến -->
  <line x1="390" y1="145" x2="455" y2="200" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="460" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">v</text>
  <!-- Trọng lực g hướng xuống -->
  <line x1="390" y1="145" x2="390" y2="215" stroke="#10b981" stroke-width="2.2" marker-end="url(#arr-green)" />
  <text x="375" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">g</text>
  <!-- Thành phần at, an -->
  <line x1="390" y1="145" x2="425" y2="175" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="430" y="170" font-family="sans-serif" font-size="11" fill="#475569">a<tspan font-size="8" dy="3">t</tspan></text>
  <line x1="390" y1="145" x2="355" y2="185" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="338" y="180" font-family="sans-serif" font-size="11" fill="#475569">a<tspan font-size="8" dy="3">n</tspan></text>
</svg>
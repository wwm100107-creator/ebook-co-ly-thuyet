<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Tâm quay O -->
  <circle cx="120" cy="240" r="5" fill="#0f172a" />
  <text x="105" y="255" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O</text>

  <!-- Bán kính OC = r -->
  <line x1="120" y1="240" x2="320" y2="150" stroke="#64748b" stroke-width="1.8" />
  <text x="210" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">r</text>

  <!-- Cung rãnh dẫn khí AB qua điểm C -->
  <path d="M 230 230 Q 320 150 430 70" fill="none" stroke="#0284c7" stroke-width="3.5" />
  <text x="225" y="250" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0284c7">A</text>
  <text x="440" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0284c7">B</text>

  <!-- Điểm C -->
  <circle cx="320" cy="150" r="5" fill="#ef4444" />
  <text x="315" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">C</text>

  <!-- Vận tốc theo v_e vuông góc OC -->
  <line x1="320" y1="150" x2="275" y2="50" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="245" y="55" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0284c7">v_e = r·ω</text>

  <!-- Vận tốc tương đối v_r tiếp tuyến rãnh AB -->
  <line x1="320" y1="150" x2="410" y2="80" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="415" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">v_r</text>

  <!-- Gia tốc Coriolis a_c = 2*omega*v_r -->
  <line x1="320" y1="150" x2="380" y2="230" stroke="#10b981" stroke-width="2.2" marker-end="url(#arr-green)" />
  <text x="385" y="240" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">a_c</text>

  <!-- Mũi tên quay omega quanh O -->
  <path d="M 80 230 A 40 40 0 0 1 120 200" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="80" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">ω</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <rect x="40" y="270" width="60" height="12" fill="url(#hatch)" stroke="#64748b" />
  <line x1="40" y1="270" x2="100" y2="270" stroke="#1e293b" stroke-width="2" />
  <rect x="240" y="270" width="60" height="12" fill="url(#hatch)" stroke="#64748b" />
  <line x1="240" y1="270" x2="300" y2="270" stroke="#1e293b" stroke-width="2" />
  
  <rect x="90" y="90" width="160" height="65" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  
  <line x1="70" y1="270" x2="110" y2="150" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
  <circle cx="70" cy="270" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <circle cx="110" cy="150" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <text x="90" y="145" class="lbl-bold">A</text>
  
  <path d="M 270 270 Q 300 210, 230 150" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
  <circle cx="270" cy="270" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <circle cx="230" cy="150" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <text x="240" y="145" class="lbl-bold">B</text>
  
  <line x1="70" y1="270" x2="135" y2="70" class="axis" />
  <line x1="110" y1="150" x2="135" y2="75" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g><text x="135" y="70" class="lbl-bold" fill="#dc2626">S<tspan font-size="12" dy="4">A</tspan></text><path d="M 135 52 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="270" y1="270" x2="205" y2="70" class="axis" />
  <line x1="230" y1="150" x2="210" y2="85" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g><text x="215" y="70" class="lbl-bold" fill="#dc2626">S<tspan font-size="12" dy="4">B</tspan></text><path d="M 215 52 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
</svg>
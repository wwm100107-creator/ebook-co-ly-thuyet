<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <g transform="translate(30, 20)">
    <path d="M 40 180 L 40 230 L 140 230 L 140 180 L 120 180 L 120 215 L 60 215 L 60 180 Z" fill="url(#hatch)" stroke="#64748b" />
    <line x1="40" y1="180" x2="140" y2="180" stroke="#1e293b" stroke-width="2" />
    <rect x="65" y="30" width="50" height="180" rx="4" class="solid" />
    <line x1="90" y1="15" x2="90" y2="240" class="axis" />
    <line x1="90" y1="210" x2="150" y2="160" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <g><text x="155" y="165" class="lbl-bold" fill="#dc2626">R</text><path d="M 155 147 h 14 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
    <text x="80" y="270" class="lbl-bold">a)</text>
  </g>
  
  <g transform="translate(260, 20)">
    <rect x="20" y="210" width="180" height="15" fill="url(#hatch)" stroke="#64748b" />
    <line x1="20" y1="210" x2="200" y2="210" stroke="#1e293b" stroke-width="2" />
    <polygon points="40,210 70,120 90,120 60,210" fill="#f1f5f9" stroke="#1e293b" />
    <polygon points="180,210 150,120 130,120 160,210" fill="#f1f5f9" stroke="#1e293b" />
    <circle cx="110" cy="110" r="55" fill="url(#hatch)" stroke="#64748b" />
    <circle cx="110" cy="110" r="45" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <circle cx="110" cy="110" r="3.5" fill="#0f172a" />
    <text x="115" y="105" class="lbl">O</text>
    
    <line x1="110" y1="110" x2="175" y2="45" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <line x1="110" y1="110" x2="60" y2="55" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <g><text x="45" y="55" class="lbl-bold" fill="#dc2626">R</text><path d="M 45 37 h 14 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
    <text x="100" y="270" class="lbl-bold">b)</text>
  </g>
</svg>
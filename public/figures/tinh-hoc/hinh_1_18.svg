<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <circle cx="60" cy="240" r="4" fill="#0f172a" />
  <text x="40" y="255" class="lbl-bold">a</text>
  
  <line x1="60" y1="240" x2="160" y2="180" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="95" y="200" class="lbl-bold" fill="#2563eb">F<tspan font-size="12" dy="4">1</tspan></text><path d="M 95 182 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  <circle cx="160" cy="180" r="4" fill="#0f172a" />
  <text x="165" y="195" class="lbl-bold">b</text>
  
  <line x1="160" y1="180" x2="280" y2="120" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="210" y="140" class="lbl-bold" fill="#2563eb">F<tspan font-size="12" dy="4">2</tspan></text><path d="M 210 122 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  <circle cx="280" cy="120" r="4" fill="#0f172a" />
  <text x="290" y="125" class="lbl-bold">c</text>
  
  <line x1="280" y1="120" x2="240" y2="40" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="265" y="75" class="lbl-bold" fill="#2563eb">F<tspan font-size="12" dy="4">3</tspan></text><path d="M 265 57 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  <circle cx="240" cy="40" r="4" fill="#0f172a" />
  <text x="245" y="35" class="lbl-bold">d</text>
  
  <line x1="60" y1="240" x2="240" y2="40" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)" />
  <g><text x="130" y="120" class="lbl-bold" fill="#dc2626">R</text><path d="M 130 102 h 14 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-sub { font-size: 14px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <!-- a) Dây treo vật tròn -->
  <g transform="translate(30, 20)">
    <!-- Giá ngàm trên trần -->
    <rect x="50" y="10" width="80" height="15" fill="url(#hatch)" stroke="#64748b" />
    <line x1="50" y1="25" x2="130" y2="25" stroke="#1e293b" stroke-width="2" />
    <!-- Dây thẳng -->
    <line x1="90" y1="25" x2="90" y2="130" stroke="#1e293b" stroke-width="1.8" />
    <!-- Quả nặng tròn -->
    <circle cx="90" cy="160" r="30" class="solid" />
    <circle cx="90" cy="160" r="2.5" fill="#0f172a" />
    <!-- Sức căng dây T -->
    <line x1="90" y1="130" x2="90" y2="70" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <text x="100" y="80" class="lbl-bold" fill="#dc2626">T&#8407;</text>
    <text x="80" y="220" class="lbl-bold">a)</text>
  </g>
  
  <!-- b) Dây vắt qua ròng rọc -->
  <g transform="translate(260, 20)">
    <!-- Ròng rọc tròn -->
    <circle cx="120" cy="110" r="50" class="solid" />
    <circle cx="120" cy="110" r="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="2" />
    <circle cx="120" cy="110" r="2" fill="#0f172a" />
    <text x="115" y="100" class="lbl">O</text>
    
    <!-- Nhánh dây trái -->
    <line x1="70" y1="110" x2="70" y2="180" stroke="#1e293b" stroke-width="2" />
    <line x1="70" y1="160" x2="70" y2="200" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <text x="50" y="190" class="lbl-bold" fill="#dc2626">T&#8407;</text>
    
    <!-- Nhánh dây phải xiên -->
    <line x1="155" y1="75" x2="205" y2="135" stroke="#1e293b" stroke-width="2" />
    <line x1="185" y1="110" x2="215" y2="145" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <text x="215" y="130" class="lbl-bold" fill="#dc2626">T&#8407;</text>
    <text x="110" y="220" class="lbl-bold">b)</text>
  </g>
</svg>
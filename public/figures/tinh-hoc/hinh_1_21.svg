<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <circle cx="160" cy="220" r="4.5" fill="#0f172a" />
  <text x="140" y="235" class="lbl-bold">O</text>
  
  <line x1="160" y1="220" x2="90" y2="100" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <g><text x="65" y="105" class="lbl-bold" fill="#2563eb">m<tspan font-size="12" dy="4">1</tspan></text><path d="M 65 87 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="160" y1="220" x2="310" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <g><text x="315" y="170" class="lbl-bold" fill="#2563eb">m<tspan font-size="12" dy="4">2</tspan></text><path d="M 315 152 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="90" y1="100" x2="240" y2="40" stroke="#94a3b8" stroke-dasharray="4,3" />
  <line x1="310" y1="160" x2="240" y2="40" stroke="#94a3b8" stroke-dasharray="4,3" />
  
  <line x1="160" y1="220" x2="240" y2="40" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)" />
  <g><text x="245" y="40" class="lbl-bold" fill="#dc2626">m</text><path d="M 245 22 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
</svg>
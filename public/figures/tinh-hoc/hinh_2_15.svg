<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- 3D Axes Oxyz -->
  <line x1="170" y1="200" x2="60" y2="340" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="50" y="355" fill="#1e293b" font-size="15" font-weight="bold" font-style="italic">x</text>

  <line x1="170" y1="200" x2="480" y2="200" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="490" y="205" fill="#1e293b" font-size="15" font-weight="bold" font-style="italic">y</text>

  <line x1="170" y1="200" x2="170" y2="40" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="160" y="35" fill="#1e293b" font-size="15" font-weight="bold" font-style="italic">z</text>
  <text x="152" y="215" fill="#1e293b" font-size="14" font-weight="bold">O</text>

  <!-- Door OABC in Oxy plane -->
  <!-- O=(170,200), A=(90,300), B=(340,300), C=(420,200) -->
  <polygon points="170,200 90,300 340,300 420,200" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>

  <!-- Point D on z axis -->
  <circle cx="170" cy="70" r="3.5" fill="#1e293b"/>
  <text x="145" y="75" fill="#1e293b" font-size="14" font-weight="bold">D</text>

  <!-- Points A, B, C -->
  <circle cx="90" cy="300" r="3" fill="#1e293b"/>
  <text x="70" y="315" fill="#1e293b" font-size="14" font-weight="bold">A</text>
  <circle cx="340" cy="300" r="3.5" fill="#1e293b"/>
  <text x="350" y="315" fill="#1e293b" font-size="14" font-weight="bold">B</text>
  <circle cx="420" cy="200" r="3" fill="#1e293b"/>
  <text x="428" y="195" fill="#1e293b" font-size="14" font-weight="bold">C</text>

  <!-- Diagonal OB -->
  <line x1="170" y1="200" x2="340" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Cable BD -->
  <line x1="340" y1="300" x2="170" y2="70" stroke="#b91c1c" stroke-width="2.5"/>

  <!-- Cable Tension T vector at B along BD -->
  <line x1="340" y1="300" x2="255" y2="185" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="280" y="215" fill="#dc2626" font-size="15" font-weight="bold" font-style="italic">T</text>

  <!-- Components of T -->
  <line x1="340" y1="300" x2="340" y2="230" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="348" y="245" fill="#dc2626" font-size="12" font-style="italic">T<tspan font-size="9" dy="2">z</tspan></text>
  <line x1="340" y1="300" x2="295" y2="300" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="270" y="315" fill="#dc2626" font-size="12" font-style="italic">T<tspan font-size="9" dy="2">y</tspan></text>
  <line x1="340" y1="300" x2="380" y2="250" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="395" y="250" fill="#dc2626" font-size="12" font-style="italic">T<tspan font-size="9" dy="2">x</tspan></text>

  <!-- Angle 60 deg at O between OA and OB -->
  <path d="M 146 230 A 35 35 0 0 0 205 220" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="180" y="245" fill="#475569" font-size="13">60°</text>

  <!-- Reactions at O (spherical pin: XO, YO, ZO) -->
  <line x1="170" y1="200" x2="105" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="95" y="265" fill="#2563eb" font-size="13" font-style="italic">X<tspan font-size="9" dy="2">O</tspan></text>
  <line x1="170" y1="200" x2="240" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="225" y="190" fill="#2563eb" font-size="13" font-style="italic">Y<tspan font-size="9" dy="2">O</tspan></text>
  <line x1="170" y1="200" x2="170" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="145" y="140" fill="#2563eb" font-size="13" font-style="italic">Z<tspan font-size="9" dy="2">O</tspan></text>

  <!-- Reactions at C (hinge: XC, ZC) -->
  <line x1="420" y1="200" x2="360" y2="275" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="355" y="285" fill="#2563eb" font-size="13" font-style="italic">X<tspan font-size="9" dy="2">C</tspan></text>
  <line x1="420" y1="200" x2="420" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="430" y="135" fill="#2563eb" font-size="13" font-style="italic">Z<tspan font-size="9" dy="2">C</tspan></text>
</svg>
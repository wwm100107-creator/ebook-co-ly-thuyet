<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.4; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 2; fill: #f8fafc; }
  </style>

  <!-- a) Tương tác hút nhau -->
  <g transform="translate(0, 15)">
    <!-- Đường tác dụng chung -->
    <line x1="50" y1="50" x2="490" y2="50" class="axis" />
    
    <!-- Quả cầu A -->
    <circle cx="130" cy="50" r="38" class="solid" />
    <circle cx="130" cy="50" r="3" fill="#0f172a" />
    <text x="122" y="56" class="lbl-bold">A</text>
    
    <!-- Quả cầu B -->
    <circle cx="410" cy="50" r="38" class="solid" />
    <circle cx="410" cy="50" r="3" fill="#0f172a" />
    <text x="402" y="56" class="lbl-bold">B</text>
    
    <!-- Lực F tác dụng lên A hướng sang B -->
    <line x1="168" y1="50" x2="245" y2="50" class="vec" marker-end="url(#arrow-blue)" />
    <g>
      <text x="195" y="38" class="lbl-bold" fill="#2563eb">F</text>
      <path d="M 195 20 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" />
    </g>
    
    <!-- Lực F' tác dụng lên B hướng sang A -->
    <line x1="372" y1="50" x2="295" y2="50" class="vec" marker-end="url(#arrow-blue)" />
    <g>
      <text x="325" y="38" class="lbl-bold" fill="#2563eb">F'</text>
      <path d="M 325 20 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" />
    </g>
  </g>
  
  <!-- b) Tương tác đẩy nhau -->
  <g transform="translate(0, 135)">
    <!-- Đường tác dụng chung -->
    <line x1="50" y1="50" x2="490" y2="50" class="axis" />
    
    <!-- Quả cầu A -->
    <circle cx="130" cy="50" r="38" class="solid" />
    <circle cx="130" cy="50" r="3" fill="#0f172a" />
    <text x="122" y="56" class="lbl-bold">A</text>
    
    <!-- Quả cầu B -->
    <circle cx="410" cy="50" r="38" class="solid" />
    <circle cx="410" cy="50" r="3" fill="#0f172a" />
    <text x="402" y="56" class="lbl-bold">B</text>
    
    <!-- Lực F' tác dụng lên A đẩy sang trái -->
    <line x1="92" y1="50" x2="35" y2="50" class="vec" marker-end="url(#arrow-blue)" />
    <g>
      <text x="50" y="38" class="lbl-bold" fill="#2563eb">F'</text>
      <path d="M 50 20 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" />
    </g>
    
    <!-- Lực F tác dụng lên B đẩy sang phải -->
    <line x1="448" y1="50" x2="505" y2="50" class="vec" marker-end="url(#arrow-blue)" />
    <g>
      <text x="465" y="38" class="lbl-bold" fill="#2563eb">F</text>
      <path d="M 465 20 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" />
    </g>
  </g>
</svg>

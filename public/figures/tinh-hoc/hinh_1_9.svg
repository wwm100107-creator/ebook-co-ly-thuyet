<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-sub { font-size: 14px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <!-- Trường hợp 1: hút/đẩy dọc đường nối tâm -->
  <g transform="translate(0, 10)">
    <circle cx="120" cy="50" r="40" class="solid" />
    <text x="110" y="55" class="lbl-bold">A</text>
    
    <circle cx="280" cy="50" r="40" class="solid" />
    <text x="270" y="55" class="lbl-bold">B</text>
    
    <line x1="60" y1="50" x2="340" y2="50" class="axis" />
    
    <!-- Lực tác dụng lẫn nhau hướng vào nhau -->
    <line x1="160" y1="50" x2="210" y2="50" class="vec" marker-end="url(#arrow-blue)" />
    <text x="180" y="40" class="lbl-bold" fill="#2563eb">F&#8407;</text>
    
    <line x1="240" y1="50" x2="190" y2="50" class="vec" marker-end="url(#arrow-blue)" />
    <text x="200" y="40" class="lbl-bold" fill="#2563eb">F'&#8407;</text>
  </g>
  
  <!-- Trường hợp 2: hướng ra xa -->
  <g transform="translate(0, 120)">
    <circle cx="120" cy="50" r="40" class="solid" />
    <text x="110" y="55" class="lbl-bold">A</text>
    
    <circle cx="280" cy="50" r="40" class="solid" />
    <text x="270" y="55" class="lbl-bold">B</text>
    
    <line x1="60" y1="50" x2="340" y2="50" class="axis" />
    
    <line x1="80" y1="50" x2="40" y2="50" class="vec" marker-end="url(#arrow-blue)" />
    <text x="45" y="40" class="lbl-bold" fill="#2563eb">F'&#8407;</text>
    
    <line x1="320" y1="50" x2="360" y2="50" class="vec" marker-end="url(#arrow-blue)" />
    <text x="340" y="40" class="lbl-bold" fill="#2563eb">F&#8407;</text>
  </g>
</svg>
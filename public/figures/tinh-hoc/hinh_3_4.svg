<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Inclined surface at angle alpha -->
  <line x1="80" y1="260" x2="380" y2="135" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="80" y1="260" x2="380" y2="260" stroke="#94a3b8" stroke-dasharray="3,3"/>
  <!-- Angle alpha -->
  <path d="M 140 260 A 60 60 0 0 0 135 238" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="145" y="252" fill="#475569" font-size="13">α</text>

  <!-- Center contact point O -->
  <!-- Contact point at x=230, y=198 -->
  <!-- Normal axis perpendicular to surface (angle = 90 - alpha ~ 67.4 deg) -->
  <line x1="230" y1="198" x2="180" y2="75" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="165" y="75" fill="#475569" font-size="14" font-weight="bold">N</text>

  <!-- Friction cone boundary lines (angle phi on each side of normal) -->
  <line x1="230" y1="198" x2="135" y2="95" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="230" y1="198" x2="225" y2="65" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Angle phi -->
  <path d="M 197 117 A 40 40 0 0 0 215 110" fill="none" stroke="#0284c7" stroke-width="1.2"/>
  <text x="202" y="100" fill="#0284c7" font-size="13">φ</text>

  <!-- Downward weight P -->
  <line x1="230" y1="198" x2="230" y2="295" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="240" y="290" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">P</text>

  <!-- Horizontal pushing force Q -->
  <line x1="230" y1="198" x2="340" y2="198" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="330" y="185" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">Q</text>

  <!-- Resultant active force R_act = P + Q -->
  <line x1="230" y1="198" x2="300" y2="265" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
</svg>
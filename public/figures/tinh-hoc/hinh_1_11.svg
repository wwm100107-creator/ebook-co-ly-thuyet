<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <g transform="translate(20, 20)">
    <path d="M 10 120 C 50 160, 130 160, 170 120 L 170 140 C 130 180, 50 180, 10 140 Z" fill="url(#hatch)" stroke="#64748b" />
    <path d="M 10 120 C 50 160, 130 160, 170 120" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="90" cy="80" r="50" class="solid" />
    <line x1="90" y1="130" x2="90" y2="20" class="axis" />
    <line x1="90" y1="130" x2="90" y2="40" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <g><text x="70" y="35" class="lbl-bold" fill="#dc2626">N</text><path d="M 70 17 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
  </g>
  
  <g transform="translate(350, 20)">
    <rect x="130" y="70" width="30" height="80" fill="url(#hatch)" stroke="#64748b" />
    <polygon points="110,110 130,100 130,120" fill="#94a3b8" stroke="#1e293b" />
    <line x1="50" y1="180" x2="160" y2="40" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <line x1="110" y1="104" x2="60" y2="65" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <g><text x="45" y="60" class="lbl-bold" fill="#dc2626">N</text><path d="M 45 42 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
  </g>
  
  <g transform="translate(40, 210)">
    <path d="M 10 150 C 60 125, 140 125, 190 150 L 190 170 L 10 170 Z" fill="url(#hatch)" stroke="#64748b" />
    <path d="M 10 150 C 60 125, 140 125, 190 150" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="100" cy="80" r="50" class="solid" />
    <line x1="40" y1="130" x2="160" y2="130" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)" />
    <text x="165" y="135" class="lbl">τ</text>
    <line x1="100" y1="130" x2="100" y2="30" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <g><text x="80" y="25" class="lbl-bold" fill="#dc2626">N</text><path d="M 80 7 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
  </g>
  
  <g transform="translate(360, 210)">
    <rect x="20" y="130" width="160" height="20" fill="url(#hatch)" stroke="#64748b" />
    <line x1="20" y1="130" x2="180" y2="130" stroke="#1e293b" stroke-width="2" />
    <polygon points="120,130 115,120 40,60 45,55 125,120" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />
    <line x1="120" y1="130" x2="120" y2="30" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <g><text x="125" y="25" class="lbl-bold" fill="#dc2626">N</text><path d="M 125 7 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-sub { font-size: 14px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <ellipse cx="220" cy="100" rx="110" ry="50" class="solid" />
  <line x1="50" y1="100" x2="390" y2="100" class="axis" />
  
  <circle cx="160" cy="100" r="4" fill="#0f172a" />
  <text x="155" y="85" class="lbl-bold">B</text>
  
  <circle cx="280" cy="100" r="4" fill="#0f172a" />
  <text x="275" y="85" class="lbl-bold">A</text>
  
  <!-- Lực ban đầu tại A -->
  <line x1="280" y1="100" x2="360" y2="100" class="vec" marker-end="url(#arrow-blue)" />
  <text x="345" y="85" class="lbl-bold" fill="#2563eb">F&#8407;<tspan font-size="14" dy="4">A</tspan></text>
  
  <!-- Hai lực cân bằng thêm vào tại B -->
  <line x1="160" y1="100" x2="240" y2="100" class="vec" marker-end="url(#arrow-blue)" />
  <text x="215" y="85" class="lbl-bold" fill="#2563eb">F&#8407;<tspan font-size="14" dy="4">B</tspan></text>
  
  <line x1="160" y1="100" x2="80" y2="100" class="vec" marker-end="url(#arrow-blue)" />
  <text x="65" y="85" class="lbl-bold" fill="#2563eb">F'&#8407;<tspan font-size="14" dy="4">B</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <polygon points="40,250 240,250 360,180 160,180" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="100" y1="320" x2="100" y2="40" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="85" y="35" class="lbl-bold">z</text>
  <circle cx="100" cy="250" r="4" fill="#0f172a" />
  <text x="80" y="265" class="lbl-bold">O</text>
  
  <circle cx="280" cy="140" r="4" fill="#0f172a" />
  <text x="290" y="140" class="lbl-bold">A(x,y,z)</text>
  <circle cx="280" cy="230" r="4" fill="#0f172a" />
  <text x="290" y="245" class="lbl-bold">A'(x,y,0)</text>
  <line x1="280" y1="140" x2="280" y2="230" class="axis" />
  
  <line x1="100" y1="250" x2="280" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g><text x="180" y="185" class="lbl" fill="#64748b">r</text><path d="M 180 167 h 10 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="100" y1="250" x2="280" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g><text x="180" y="260" class="lbl" fill="#64748b">ρ</text><path d="M 180 242 h 11 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="280" y1="140" x2="200" y2="80" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="215" y="70" class="lbl-bold" fill="#2563eb">F</text><path d="M 215 52 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="280" y1="230" x2="200" y2="170" class="vec" stroke="#0284c7" marker-end="url(#arrow-blue)" />
  <g><text x="215" y="165" class="lbl-bold" fill="#0284c7">F'</text><path d="M 215 147 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="200" y1="80" x2="200" y2="170" class="axis" />
  <line x1="100" y1="250" x2="200" y2="170" stroke="#94a3b8" stroke-dasharray="3,3" />
</svg>
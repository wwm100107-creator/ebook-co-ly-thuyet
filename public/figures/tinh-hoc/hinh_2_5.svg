<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16a34a" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 15px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 16px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .title { font-size: 14px; font-weight: bold; fill: #1e293b; }
  </style>

  <!-- Phần (a): Hợp hai lực song song cùng chiều F1, F2 -->
  <g transform="translate(10, 10)">
    <text x="135" y="18" class="title" text-anchor="middle">a) Hai lực song song cùng chiều</text>

    <!-- Đoạn thẳng AB nối điểm đặt A(55, 75) và B(215, 75) -->
    <line x1="55" y1="75" x2="215" y2="75" stroke="#1e293b" stroke-width="2.5" />
    <circle cx="55" cy="75" r="4" fill="#0f172a" />
    <text x="45" y="65" class="lbl-bold">A</text>
    <circle cx="215" cy="75" r="4" fill="#0f172a" />
    <text x="218" y="65" class="lbl-bold">B</text>

    <!-- Lực F1 tại A và F2 tại B -->
    <line x1="55" y1="75" x2="55" y2="145" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arr-blue)" />
    <text x="30" y="140" class="lbl-bold" fill="#2563eb">F<tspan font-size="11" dy="3">1</tspan></text>

    <line x1="215" y1="75" x2="215" y2="175" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arr-blue)" />
    <text x="223" y="170" class="lbl-bold" fill="#2563eb">F<tspan font-size="11" dy="3">2</tspan></text>

    <!-- Tâm C(155, 75) chia trong AB và hợp lực R = F1 + F2 -->
    <circle cx="155" cy="75" r="4.5" fill="#dc2626" />
    <text x="150" y="63" class="lbl-bold" fill="#dc2626">C</text>
    <line x1="155" y1="75" x2="155" y2="215" stroke="#dc2626" stroke-width="2.8" marker-end="url(#arr-red)" />
    <text x="163" y="210" class="lbl-bold" fill="#dc2626">R = F<tspan font-size="11" dy="3">1</tspan><tspan dy="-3"> + F</tspan><tspan font-size="11" dy="3">2</tspan></text>
  </g>

  <line x1="295" y1="20" x2="295" y2="235" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Phần (b): Hợp hai lực song song ngược chiều (F2 > F1) -->
  <g transform="translate(310, 10)">
    <text x="140" y="18" class="title" text-anchor="middle">b) Hai lực song song ngược chiều (F<tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> &gt; F</tspan><tspan font-size="10" dy="3">1</tspan><tspan dy="-3">)</tspan></text>

    <!-- Đường thẳng qua A(45, 115), B(145, 115) kéo dài đến tâm chia ngoài C(225, 115) -->
    <line x1="45" y1="115" x2="145" y2="115" stroke="#1e293b" stroke-width="2.5" />
    <line x1="145" y1="115" x2="225" y2="115" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,3" />

    <circle cx="45" cy="115" r="4" fill="#0f172a" />
    <text x="32" y="132" class="lbl-bold">A</text>
    <!-- Lực F1 hướng lên tại A -->
    <line x1="45" y1="115" x2="45" y2="50" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arr-green)" />
    <text x="53" y="60" class="lbl-bold" fill="#16a34a">F<tspan font-size="11" dy="3">1</tspan></text>

    <circle cx="145" cy="115" r="4" fill="#0f172a" />
    <text x="130" y="106" class="lbl-bold">B</text>
    <!-- Lực F2 hướng xuống tại B -->
    <line x1="145" y1="115" x2="145" y2="215" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arr-blue)" />
    <text x="115" y="210" class="lbl-bold" fill="#2563eb">F<tspan font-size="11" dy="3">2</tspan></text>

    <!-- Tâm chia ngoài C(225, 115) và hợp lực R = F2 - F1 -->
    <circle cx="225" cy="115" r="4.5" fill="#dc2626" />
    <text x="225" y="104" class="lbl-bold" fill="#dc2626">C</text>
    <line x1="225" y1="115" x2="225" y2="178" stroke="#dc2626" stroke-width="2.8" marker-end="url(#arr-red)" />
    <text x="195" y="198" class="lbl-bold" fill="#dc2626">R = F<tspan font-size="11" dy="3">2</tspan><tspan dy="-3"> − F</tspan><tspan font-size="11" dy="3">1</tspan></text>
  </g>
</svg>

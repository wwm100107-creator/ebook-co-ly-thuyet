<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16a34a" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 15px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 17px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .title { font-size: 14px; font-weight: bold; fill: #1e293b; }
  </style>

  <!-- Hình a: Lực F tại A và thêm cặp lực cân bằng (F', F'') tại tâm O -->
  <g transform="translate(10, 10)">
    <text x="135" y="18" class="title" text-anchor="middle">a) Thêm cặp lực cân bằng tại tâm O</text>
    <ellipse cx="135" cy="135" rx="115" ry="85" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8" />

    <!-- Điểm A(185, 115) và lực F -->
    <circle cx="185" cy="115" r="4" fill="#0f172a" />
    <text x="192" y="122" class="lbl-bold">A</text>
    <line x1="185" y1="115" x2="225" y2="55" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)" />
    <text x="230" y="60" class="lbl-bold" fill="#2563eb">F</text>

    <!-- Tâm thu gọn O(95, 145): thêm F' // F và F'' = -F' -->
    <circle cx="95" cy="145" r="4" fill="#0f172a" />
    <text x="76" y="150" class="lbl-bold">O</text>
    <line x1="95" y1="145" x2="135" y2="85" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)" />
    <text x="138" y="88" class="lbl-bold" fill="#dc2626">F'</text>

    <line x1="95" y1="145" x2="55" y2="205" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#arr-green)" />
    <text x="35" y="205" class="lbl-bold" fill="#16a34a">F''</text>

    <!-- Cánh tay đòn d giữa hai đường tác dụng -->
    <line x1="95" y1="145" x2="165" y2="145" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,3" />
    <text x="132" y="162" class="lbl">d</text>
  </g>

  <text x="300" y="145" font-size="24" font-weight="bold" fill="#475569" text-anchor="middle">⇔</text>

  <!-- Hình b: Kết quả dời lực về O gồm lực F' và ngẫu lực m_O(F) -->
  <g transform="translate(320, 10)">
    <text x="135" y="18" class="title" text-anchor="middle">b) Lực F' tại O và mômen chính m<tspan font-size="10" dy="3">O</tspan><tspan dy="-3">(F)</tspan></text>
    <ellipse cx="135" cy="135" rx="115" ry="85" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8" />

    <circle cx="115" cy="150" r="4.5" fill="#0f172a" />
    <text x="95" y="158" class="lbl-bold">O</text>

    <!-- Lực F' = F đặt tại O -->
    <line x1="115" y1="150" x2="160" y2="82" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)" />
    <text x="166" y="86" class="lbl-bold" fill="#dc2626">F' = F</text>

    <!-- Cung mômen ngẫu lực m_O(F) = F.d -->
    <path d="M 145 175 A 36 36 0 1 0 92 122" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-green)" />
    <text x="148" y="162" class="lbl-bold" fill="#16a34a">m<tspan font-size="11" dy="3">O</tspan><tspan dy="-3">(F) = F·d</tspan></text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Bearings at G (top) and E (bottom) -->
  <rect x="110" y="60" width="18" height="35" fill="url(#hatch)" stroke="#475569"/>
  <rect x="142" y="60" width="18" height="35" fill="url(#hatch)" stroke="#475569"/>
  
  <rect x="110" y="325" width="50" height="25" fill="url(#hatch)" stroke="#475569"/>
  <line x1="100" y1="350" x2="170" y2="350" stroke="#1e293b" stroke-width="2"/>

  <!-- Vertical Mast GE -->
  <line x1="135" y1="40" x2="135" y2="340" stroke="#1e293b" stroke-width="4"/>

  <!-- Horizontal Beam AC -->
  <line x1="135" y1="160" x2="430" y2="160" stroke="#1e293b" stroke-width="3.5"/>

  <!-- Inclined Strut from E to mid of AC -->
  <line x1="135" y1="310" x2="265" y2="160" stroke="#1e293b" stroke-width="3"/>

  <!-- Point G, A, E, D, C -->
  <circle cx="135" cy="78" r="4" fill="#1e293b"/>
  <text x="155" y="82" fill="#1e293b" font-size="14" font-weight="bold">G</text>

  <circle cx="135" cy="160" r="3" fill="#1e293b"/>
  <text x="115" y="165" fill="#1e293b" font-size="14" font-weight="bold">A</text>

  <circle cx="135" cy="340" r="4" fill="#1e293b"/>
  <text x="130" y="365" fill="#1e293b" font-size="14" font-weight="bold">E</text>

  <circle cx="200" cy="235" r="4" fill="#1e293b"/>
  <text x="210" y="230" fill="#1e293b" font-size="14" font-weight="bold">D</text>

  <circle cx="395" cy="160" r="3" fill="#1e293b"/>
  <text x="405" y="180" fill="#1e293b" font-size="14" font-weight="bold">C</text>

  <!-- Trolley at C -->
  <circle cx="385" cy="150" r="6" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="405" cy="150" r="6" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="395,160 385,152 405,152" fill="#1e293b"/>

  <!-- Suspended Load Q at C -->
  <line x1="395" y1="160" x2="395" y2="250" stroke="#475569" stroke-width="1.5"/>
  <rect x="380" y="250" width="30" height="28" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="395" cy="264" r="2.5" fill="#1e293b"/>
  <line x1="395" y1="278" x2="395" y2="330" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="405" y="325" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">Q</text>

  <!-- Force P at D -->
  <line x1="200" y1="235" x2="200" y2="310" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="210" y="300" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">P</text>

  <!-- Reactions XG, XE, YE -->
  <line x1="135" y1="78" x2="45" y2="78" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="50" y="68" fill="#2563eb" font-size="14" font-weight="bold" font-style="italic">X<tspan font-size="10" dy="4">G</tspan></text>

  <line x1="135" y1="340" x2="225" y2="340" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="215" y="360" fill="#2563eb" font-size="14" font-weight="bold" font-style="italic">X<tspan font-size="10" dy="4">E</tspan></text>

  <line x1="135" y1="340" x2="135" y2="260" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="110" y="275" fill="#2563eb" font-size="14" font-weight="bold" font-style="italic">Y<tspan font-size="10" dy="4">E</tspan></text>

  <!-- Dimensions -->
  <!-- Mast height 5m -->
  <line x1="75" y1="78" x2="75" y2="340" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="70" y1="78" x2="110" y2="78" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <line x1="70" y1="340" x2="110" y2="340" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <text x="60" y="215" fill="#475569" font-size="13" text-anchor="middle" transform="rotate(-90 60 215)">5m</text>

  <!-- AC length 5m -->
  <line x1="135" y1="125" x2="395" y2="125" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="135" y1="120" x2="135" y2="160" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <line x1="395" y1="120" x2="395" y2="160" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <text x="265" y="118" fill="#475569" font-size="13" text-anchor="middle">5m</text>

  <!-- D offset 2m -->
  <line x1="135" y1="195" x2="200" y2="195" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="200" y1="190" x2="200" y2="235" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <text x="168" y="190" fill="#475569" font-size="12" text-anchor="middle">2m</text>
</svg>
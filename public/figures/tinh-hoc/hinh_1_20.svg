<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-sub { font-size: 14px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <!-- Mặt phẳng I -->
  <polygon points="40,280 260,280 360,190 140,190" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="55" y="270" class="lbl-bold">I</text>
  
  <!-- Mặt phẳng II song song ở trên -->
  <polygon points="40,130 260,130 360,40 140,40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="55" y="120" class="lbl-bold">II</text>
  
  <!-- Ngẫu lực ở mặt phẳng I -->
  <line x1="120" y1="250" x2="200" y2="220" class="vec" marker-end="url(#arrow-blue)" />
  <text x="160" y="260" class="lbl-bold" fill="#2563eb">F&#8407;</text>
  
  <line x1="280" y1="220" x2="200" y2="250" class="vec" marker-end="url(#arrow-blue)" />
  <text x="250" y="255" class="lbl-bold" fill="#2563eb">F'&#8407;</text>
  
  <!-- Dời sang ngẫu lực ở mặt phẳng II -->
  <line x1="120" y1="100" x2="200" y2="70" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="160" y="110" class="lbl-bold" fill="#16a34a">F&#8407;</text>
  
  <line x1="280" y1="70" x2="200" y2="100" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="250" y="105" class="lbl-bold" fill="#16a34a">F'&#8407;</text>
  
  <!-- Vectơ mô men m -->
  <line x1="250" y1="200" x2="250" y2="20" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="260" y="30" class="lbl-bold" fill="#dc2626">m&#8407;</text>
</svg>
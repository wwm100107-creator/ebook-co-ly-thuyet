<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Wall at A -->
  <rect x="75" y="50" width="20" height="120" fill="url(#hatch)" stroke="#334155" stroke-width="1.5"/>
  <line x1="95" y1="45" x2="95" y2="175" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Cantilever Beam AB -->
  <rect x="95" y="105" width="300" height="14" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
  <circle cx="95" cy="112" r="3" fill="#1e293b"/>
  <circle cx="395" cy="112" r="3" fill="#1e293b"/>
  <text x="82" y="130" fill="#1e293b" font-size="14" font-weight="bold">A</text>
  <text x="402" y="118" fill="#1e293b" font-size="14" font-weight="bold">B</text>

  <!-- Distributed load q0 -->
  <line x1="95" y1="72" x2="395" y2="72" stroke="#475569" stroke-width="1.2"/>
  <!-- Arrows for q0 -->
  <g stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)">
    <line x1="110" y1="72" x2="110" y2="103"/>
    <line x1="140" y1="72" x2="140" y2="103"/>
    <line x1="170" y1="72" x2="170" y2="103"/>
    <line x1="200" y1="72" x2="200" y2="103"/>
    <line x1="230" y1="72" x2="230" y2="103"/>
    <line x1="260" y1="72" x2="260" y2="103"/>
    <line x1="290" y1="72" x2="290" y2="103"/>
    <line x1="320" y1="72" x2="320" y2="103"/>
    <line x1="350" y1="72" x2="350" y2="103"/>
    <line x1="380" y1="72" x2="380" y2="103"/>
  </g>
  <text x="245" y="60" fill="#475569" font-size="13" font-style="italic" font-weight="bold">q<tspan font-size="10" dy="3">0</tspan></text>

  <!-- Resultant Q = q0*l at l/2 -->
  <line x1="245" y1="119" x2="245" y2="175" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="255" y="170" fill="#dc2626" font-size="13" font-weight="bold" font-style="italic">Q</text>

  <!-- End Force P at B -->
  <line x1="395" y1="40" x2="395" y2="105" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="405" y="55" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">P</text>

  <!-- Couple Moment M at B (clockwise) -->
  <path d="M 370 95 A 18 18 0 1 1 385 130" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="415" y="95" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">M</text>

  <!-- Wall Reactions XA, YA, MA -->
  <line x1="95" y1="112" x2="95" y2="40" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="102" y="48" fill="#2563eb" font-size="13" font-weight="bold" font-style="italic">Y<tspan font-size="10" dy="3">A</tspan></text>

  <line x1="95" y1="126" x2="160" y2="126" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="150" y="142" fill="#2563eb" font-size="12" font-weight="bold" font-style="italic">X<tspan font-size="10" dy="3">A</tspan></text>

  <path d="M 108 90 A 20 20 0 0 0 65 112" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="35" y="100" fill="#2563eb" font-size="13" font-weight="bold" font-style="italic">M<tspan font-size="10" dy="-4">A</tspan></text>

  <!-- Dimensions -->
  <line x1="95" y1="195" x2="395" y2="195" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="95" y1="120" x2="95" y2="202" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <line x1="395" y1="120" x2="395" y2="202" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <text x="245" y="190" fill="#475569" font-size="13" text-anchor="middle" font-style="italic">l</text>

  <line x1="245" y1="150" x2="395" y2="150" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <text x="320" y="145" fill="#475569" font-size="12" text-anchor="middle">l / 2</text>
</svg>
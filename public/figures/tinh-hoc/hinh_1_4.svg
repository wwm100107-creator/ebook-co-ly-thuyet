<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <!-- Mặt phẳng tác dụng của ngẫu lực -->
  <polygon points="50,220 260,220 370,110 160,110" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  
  <!-- Lực F' hướng xuống trái -->
  <line x1="115" y1="162" x2="65" y2="227" class="vec" marker-end="url(#arrow-blue)" />
  <circle cx="115" cy="162" r="3.5" fill="#1e293b" />
  <g><text x="45" y="200" class="lbl-bold" fill="#2563eb">F'</text><path d="M 45 182 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <!-- Lực F hướng lên phải -->
  <line x1="235" y1="255" x2="285" y2="190" class="vec" marker-end="url(#arrow-blue)" />
  <circle cx="235" cy="255" r="3.5" fill="#1e293b" />
  <g><text x="295" y="195" class="lbl-bold" fill="#2563eb">F</text><path d="M 295 177 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <!-- Cánh tay đòn d vuông góc với hai đường tác dụng (từ 115,162 đến 235,255) -->
  <line x1="115" y1="162" x2="235" y2="255" stroke="#dc2626" stroke-width="1.8" />
  <text x="185" y="222" class="lbl-bold" fill="#dc2626">d</text>
  
  <!-- Ký hiệu góc vuông 90 độ chuẩn xác tại tiếp điểm (235, 255) -->
  <polyline points="227.4,249.0 233.5,241.1 241.4,247.2" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Vectơ mômen ngẫu lực m vuông góc với mặt phẳng -->
  <line x1="230" y1="150" x2="230" y2="40" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <path d="M 218 80 A 14 14 0 0 1 242 80" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <g><text x="240" y="45" class="lbl-bold" fill="#16a34a">m</text><path d="M 240 27 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#16a34a" stroke-width="1.3" stroke-linecap="round" /></g>
</svg>
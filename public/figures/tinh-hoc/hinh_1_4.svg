  <polyline points="233,205 240,210 245,203" fill="none" stroke="#dc2626" stroke-width="1.2" />
  <text x="195" y="200" class="lbl-bold" fill="#dc2626">d</text>
  
  <line x1="230" y1="150" x2="230" y2="40" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow)" />
  <path d="M 218 80 A 14 14 0 0 1 242 80" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)" />

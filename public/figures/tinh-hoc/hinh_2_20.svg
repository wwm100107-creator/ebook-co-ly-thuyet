<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Hinge at C -->
  <polygon points="85,60 70,80 100,80" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="85" cy="60" r="4" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="68" y="60" fill="#1e293b" font-size="14" font-weight="bold">C</text>

  <!-- Horizontal lever arm CD (length 50cm) -->
  <line x1="85" y1="60" x2="460" y2="60" stroke="#1e293b" stroke-width="4"/>
  <circle cx="460" cy="60" r="3" fill="#1e293b"/>
  <text x="468" y="65" fill="#1e293b" font-size="14" font-weight="bold">D</text>

  <!-- Point B on lever (BC = 7cm) -->
  <circle cx="160" cy="60" r="4" fill="#1e293b"/>
  <text x="165" y="52" fill="#1e293b" font-size="14" font-weight="bold">B</text>

  <!-- Stem from B down to Valve A -->
  <line x1="160" y1="60" x2="160" y2="150" stroke="#1e293b" stroke-width="3"/>
  <text x="170" y="145" fill="#1e293b" font-size="14" font-weight="bold">A</text>

  <!-- Valve disc A (conical plug) -->
  <polygon points="120,150 200,150 185,175 135,175" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>

  <!-- Valve seat (hatch) -->
  <polygon points="80,150 120,150 135,175 80,175" fill="url(#hatch)" stroke="#334155"/>
  <polygon points="200,150 240,150 240,175 185,175" fill="url(#hatch)" stroke="#334155"/>

  <!-- Gas pressure p pushing UP on valve A -->
  <g stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)">
    <line x1="140" y1="215" x2="140" y2="180"/>
    <line x1="160" y1="215" x2="160" y2="180"/>
    <line x1="180" y1="215" x2="180" y2="180"/>
  </g>
  <text x="155" y="235" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">P</text>

  <!-- Counterweight Q at D -->
  <line x1="460" y1="60" x2="460" y2="110" stroke="#475569" stroke-width="2"/>
  <path d="M 440 110 Q 460 95 480 110 L 485 140 Q 460 145 435 140 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="460" y1="145" x2="460" y2="185" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="470" y="180" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">Q</text>
</svg>
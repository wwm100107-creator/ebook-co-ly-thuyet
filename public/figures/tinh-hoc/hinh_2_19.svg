<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Lever body -->
  <path d="M 80 180 C 60 120 120 70 200 90 C 260 110 260 210 190 230 C 130 240 90 210 80 180 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>

  <!-- Fixed axle O -->
  <rect x="170" y="190" width="30" height="8" fill="url(#hatch)" stroke="#334155"/>
  <polygon points="185,170 175,190 195,190" fill="#e2e8f0" stroke="#1e293b"/>
  <circle cx="185" cy="170" r="4" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="195" y="170" fill="#1e293b" font-size="14" font-weight="bold">O</text>

  <!-- Forces F1, F2, Fn -->
  <line x1="90" y1="120" x2="60" y2="70" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="45" y="80" fill="#dc2626" font-size="13" font-style="italic">F<tspan font-size="9" dy="2">1</tspan></text>

  <line x1="240" y1="180" x2="280" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="270" y="245" fill="#dc2626" font-size="13" font-style="italic">F<tspan font-size="9" dy="2">2</tspan></text>

  <line x1="210" y1="100" x2="250" y2="60" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="255" y="70" fill="#dc2626" font-size="13" font-style="italic">F<tspan font-size="9" dy="2">n</tspan></text>

  <!-- Reactions XO, YO -->
  <line x1="185" y1="170" x2="235" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="225" y="160" fill="#2563eb" font-size="12" font-style="italic">X<tspan font-size="9" dy="2">O</tspan></text>
  <line x1="185" y1="170" x2="185" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="168" y="135" fill="#2563eb" font-size="12" font-style="italic">Y<tspan font-size="9" dy="2">O</tspan></text>
</svg>
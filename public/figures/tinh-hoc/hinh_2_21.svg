<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Rail track / ground -->
  <line x1="100" y1="320" x2="350" y2="320" stroke="#1e293b" stroke-width="2"/>
  <rect x="100" y="320" width="250" height="10" fill="url(#hatch)" stroke="#64748b"/>

  <!-- Wheels at A and B (distance 1m) -->
  <circle cx="160" cy="312" r="8" fill="#fff" stroke="#1e293b" stroke-width="2"/>
  <circle cx="260" cy="312" r="8" fill="#fff" stroke="#1e293b" stroke-width="2"/>
  <circle cx="160" cy="312" r="2" fill="#1e293b"/>
  <circle cx="260" cy="312" r="2" fill="#1e293b"/>
  <text x="155" y="338" fill="#1e293b" font-size="14" font-weight="bold">A</text>
  <text x="255" y="338" fill="#1e293b" font-size="14" font-weight="bold">B</text>

  <!-- Carriage chassis -->
  <rect x="145" y="295" width="130" height="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>
  <circle cx="210" cy="301" r="3" fill="#1e293b"/>
  <text x="206" y="290" fill="#1e293b" font-size="13" font-weight="bold">I</text>

  <!-- Tower body -->
  <line x1="195" y1="295" x2="195" y2="100" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="225" y1="295" x2="225" y2="100" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Tower bracing -->
  <line x1="195" y1="270" x2="225" y2="240" stroke="#64748b" stroke-width="1.2"/>
  <line x1="195" y1="240" x2="225" y2="270" stroke="#64748b" stroke-width="1.2"/>
  <line x1="195" y1="220" x2="225" y2="190" stroke="#64748b" stroke-width="1.2"/>
  <line x1="195" y1="190" x2="225" y2="220" stroke="#64748b" stroke-width="1.2"/>
  <line x1="195" y1="170" x2="225" y2="140" stroke="#64748b" stroke-width="1.2"/>
  <line x1="195" y1="140" x2="225" y2="170" stroke="#64748b" stroke-width="1.2"/>
  <line x1="195" y1="120" x2="225" y2="100" stroke="#64748b" stroke-width="1.2"/>

  <!-- Horizontal Jib and Counter-jib -->
  <!-- Main jib to the right (carrying Q) -->
  <line x1="110" y1="90" x2="450" y2="90" stroke="#1e293b" stroke-width="3"/>
  <polygon points="210,50 195,90 225,90" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="210" y1="50" x2="410" y2="90" stroke="#475569" stroke-width="1.5"/>
  <line x1="210" y1="50" x2="130" y2="90" stroke="#475569" stroke-width="1.5"/>

  <!-- Counterweight P2 on left (1m from I) -->
  <rect x="100" y="95" width="25" height="20" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="112" y1="115" x2="112" y2="165" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="80" y="150" fill="#dc2626" font-size="13" font-weight="bold">P<tspan font-size="9" dy="2">2</tspan></text>

  <!-- Crane weight P1 at center I -->
  <line x1="210" y1="180" x2="210" y2="260" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="216" y="240" fill="#dc2626" font-size="13" font-weight="bold">P<tspan font-size="9" dy="2">1</tspan></text>

  <!-- Load Q at right end (2m from I) -->
  <line x1="410" y1="90" x2="410" y2="160" stroke="#475569" stroke-width="1.5"/>
  <rect x="398" y="160" width="24" height="20" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="410" y1="180" x2="410" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="420" y="210" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">Q</text>
</svg>
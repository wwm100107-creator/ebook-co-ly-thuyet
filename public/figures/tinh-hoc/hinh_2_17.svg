<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Central shaft AB lying along axis -->
  <!-- Bearing supports at B (left) and A (right) -->
  <rect x="75" y="240" width="30" height="40" fill="url(#hatch)" stroke="#334155"/>
  <rect x="420" y="145" width="30" height="40" fill="url(#hatch)" stroke="#334155"/>

  <!-- Shaft -->
  <line x1="90" y1="260" x2="435" y2="165" stroke="#1e293b" stroke-width="5"/>
  <circle cx="90" cy="260" r="3" fill="#1e293b"/>
  <text x="68" y="275" fill="#1e293b" font-size="14" font-weight="bold">B</text>
  <circle cx="435" cy="165" r="3" fill="#1e293b"/>
  <text x="445" y="160" fill="#1e293b" font-size="14" font-weight="bold">A</text>

  <!-- Winch drum in the middle -->
  <ellipse cx="280" cy="210" rx="30" ry="45" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="370" cy="183" rx="30" ry="45" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
  <line x1="280" y1="165" x2="370" y2="138" stroke="#1e293b" stroke-width="2"/>
  <line x1="280" y1="255" x2="370" y2="228" stroke="#1e293b" stroke-width="2"/>

  <!-- Pulley on left -->
  <ellipse cx="140" cy="245" rx="20" ry="55" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>

  <!-- Hanging weight P from drum -->
  <line x1="330" y1="220" x2="330" y2="300" stroke="#475569" stroke-width="2"/>
  <rect x="318" y="300" width="24" height="20" fill="#94a3b8" stroke="#1e293b"/>
  <line x1="330" y1="320" x2="330" y2="360" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="340" y="350" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">P</text>

  <!-- Belt forces T1 and T2 on pulley -->
  <line x1="145" y1="300" x2="185" y2="360" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="195" y="365" fill="#dc2626" font-size="13" font-style="italic">T<tspan font-size="9" dy="2">1</tspan></text>
  <line x1="125" y1="290" x2="165" y2="350" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="175" y="335" fill="#dc2626" font-size="13" font-style="italic">T<tspan font-size="9" dy="2">2</tspan></text>

  <!-- Couple Moment M at A -->
  <path d="M 410 185 A 25 15 0 1 1 425 210" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="400" y="225" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">M</text>

  <!-- Bearing Reactions at A: XA, ZA -->
  <line x1="435" y1="165" x2="435" y2="105" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="442" y="115" fill="#2563eb" font-size="13" font-style="italic">Z<tspan font-size="9" dy="2">A</tspan></text>
  <line x1="435" y1="165" x2="485" y2="210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="480" y="225" fill="#2563eb" font-size="13" font-style="italic">X<tspan font-size="9" dy="2">A</tspan></text>

  <!-- Bearing Reactions at B: XB, ZB -->
  <line x1="90" y1="260" x2="90" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="98" y="210" fill="#2563eb" font-size="13" font-style="italic">Z<tspan font-size="9" dy="2">B</tspan></text>
  <line x1="90" y1="260" x2="140" y2="305" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="135" y="325" fill="#2563eb" font-size="13" font-style="italic">X<tspan font-size="9" dy="2">B</tspan></text>
</svg>
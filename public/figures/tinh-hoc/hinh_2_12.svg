<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Ground at B (roller) -->
  <rect x="70" y="200" width="40" height="8" fill="url(#hatch)" stroke="#64748b" stroke-width="1"/>
  <line x1="70" y1="200" x2="110" y2="200" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Rollers at B -->
  <circle cx="80" cy="194" r="5" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="100" cy="194" r="5" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="90,175 76,189 104,189" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="90" cy="175" r="4" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ground at A (fixed pin) -->
  <rect x="490" y="190" width="40" height="8" fill="url(#hatch)" stroke="#64748b" stroke-width="1"/>
  <line x1="490" y1="190" x2="530" y2="190" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="510,175 496,190 524,190" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="510" cy="175" r="4" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Main Bottom Beam AB -->
  <line x1="90" y1="175" x2="510" y2="175" stroke="#1e293b" stroke-width="4"/>

  <!-- Truss Arch -->
  <path d="M 90 175 Q 300 50 510 175" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="132" y1="175" x2="132" y2="142" stroke="#475569" stroke-width="1.5"/>
  <line x1="174" y1="175" x2="174" y2="118" stroke="#475569" stroke-width="1.5"/>
  <line x1="216" y1="175" x2="216" y2="103" stroke="#475569" stroke-width="1.5"/>
  <line x1="258" y1="175" x2="258" y2="95" stroke="#475569" stroke-width="1.5"/>
  <line x1="300" y1="175" x2="300" y2="92" stroke="#475569" stroke-width="1.5"/>
  <line x1="342" y1="175" x2="342" y2="95" stroke="#475569" stroke-width="1.5"/>
  <line x1="384" y1="175" x2="384" y2="104" stroke="#475569" stroke-width="1.5"/>
  <line x1="426" y1="175" x2="426" y2="119" stroke="#475569" stroke-width="1.5"/>
  <line x1="468" y1="175" x2="468" y2="142" stroke="#475569" stroke-width="1.5"/>

  <line x1="90" y1="175" x2="132" y2="142" stroke="#475569" stroke-width="1.5"/>
  <line x1="132" y1="175" x2="174" y2="118" stroke="#475569" stroke-width="1.5"/>
  <line x1="174" y1="175" x2="216" y2="103" stroke="#475569" stroke-width="1.5"/>
  <line x1="216" y1="175" x2="258" y2="95" stroke="#475569" stroke-width="1.5"/>
  <line x1="258" y1="175" x2="300" y2="92" stroke="#475569" stroke-width="1.5"/>
  <line x1="342" y1="175" x2="300" y2="92" stroke="#475569" stroke-width="1.5"/>
  <line x1="384" y1="175" x2="342" y2="95" stroke="#475569" stroke-width="1.5"/>
  <line x1="426" y1="175" x2="384" y2="104" stroke="#475569" stroke-width="1.5"/>
  <line x1="468" y1="175" x2="426" y2="119" stroke="#475569" stroke-width="1.5"/>
  <line x1="510" y1="175" x2="468" y2="142" stroke="#475569" stroke-width="1.5"/>

  <!-- Active Forces P, Q, F -->
  <line x1="300" y1="45" x2="300" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="306" y="60" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">P</text>
  <line x1="405" y1="65" x2="405" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="412" y="80" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">Q</text>
  <line x1="310" y1="102" x2="360" y2="102" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="330" y="94" fill="#dc2626" font-size="14" font-weight="bold" font-style="italic">F</text>
  <line x1="360" y1="102" x2="560" y2="102" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Reactions -->
  <line x1="90" y1="175" x2="90" y2="75" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="98" y="85" fill="#2563eb" font-size="14" font-weight="bold" font-style="italic">N<tspan font-size="10" dy="4">B</tspan></text>
  <line x1="510" y1="175" x2="510" y2="75" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="518" y="85" fill="#2563eb" font-size="14" font-weight="bold" font-style="italic">Y<tspan font-size="10" dy="4">A</tspan></text>
  <line x1="510" y1="175" x2="570" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="560" y="195" fill="#2563eb" font-size="14" font-weight="bold" font-style="italic">X<tspan font-size="10" dy="4">A</tspan></text>

  <!-- Labels B, C, D, A -->
  <text x="68" y="180" fill="#1e293b" font-size="15" font-weight="bold">B</text>
  <text x="294" y="193" fill="#1e293b" font-size="14" font-weight="bold">C</text>
  <text x="400" y="193" fill="#1e293b" font-size="14" font-weight="bold">D</text>
  <text x="480" y="180" fill="#1e293b" font-size="15" font-weight="bold">A</text>

  <!-- Dimension lines -->
  <line x1="90" y1="220" x2="300" y2="220" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="90" y1="185" x2="90" y2="228" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="300" y1="185" x2="300" y2="228" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="185" y="215" fill="#475569" font-size="13" text-anchor="middle">2a</text>

  <line x1="405" y1="220" x2="510" y2="220" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="405" y1="185" x2="405" y2="228" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="510" y1="185" x2="510" y2="228" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="455" y="215" fill="#475569" font-size="13" text-anchor="middle">a</text>

  <line x1="90" y1="245" x2="510" y2="245" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="90" y1="220" x2="90" y2="252" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="510" y1="220" x2="510" y2="252" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="295" y="240" fill="#475569" font-size="13" text-anchor="middle">4a</text>

  <line x1="550" y1="102" x2="550" y2="175" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="510" y1="175" x2="558" y2="175" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="562" y="142" fill="#475569" font-size="13">d</text>
</svg>
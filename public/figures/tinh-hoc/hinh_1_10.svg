    <line x1="50" y1="30" x2="90" y2="30" class="vec" marker-end="url(#arrow-blue)" />
    <g><text x="60" y="20" class="lbl-bold" fill="#2563eb">F</text><path d="M 60 2 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
    
    <line x1="250" y1="30" x2="210" y2="30" class="vec" marker-end="url(#arrow-blue)" />

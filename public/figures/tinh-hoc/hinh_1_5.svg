<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <circle cx="60" cy="180" r="4" fill="#0f172a" />
  <text x="40" y="195" class="lbl-bold">O</text>
  
  <line x1="60" y1="180" x2="160" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g><text x="100" y="145" class="lbl" fill="#64748b">r<tspan font-size="12" dy="4">1</tspan></text><path d="M 100 127 h 10 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="60" y1="180" x2="220" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g><text x="140" y="205" class="lbl" fill="#64748b">r<tspan font-size="12" dy="4">2</tspan></text><path d="M 140 187 h 10 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="160" y1="130" x2="220" y2="180" stroke="#94a3b8" stroke-dasharray="4,3" />
  <line x1="160" y1="130" x2="110" y2="70" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="110" y="60" class="lbl-bold" fill="#2563eb">F<tspan font-size="12" dy="4">1</tspan></text><path d="M 110 42 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="220" y1="180" x2="270" y2="240" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="275" y="235" class="lbl-bold" fill="#2563eb">F<tspan font-size="12" dy="4">2</tspan></text><path d="M 275 217 h 13 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
</svg>
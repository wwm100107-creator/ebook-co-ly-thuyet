<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <!-- Hình bên trái: Thu gọn về gốc O (vectơ chính R'O và mômen chính MO) -->
  <ellipse cx="200" cy="140" rx="100" ry="65" class="solid" />
  <circle cx="160" cy="150" r="4.5" fill="#0f172a" />
  <text x="140" y="155" class="lbl-bold">O</text>
  
  <line x1="160" y1="150" x2="90" y2="80" class="vec" marker-end="url(#arrow-blue)" />
  <g><text x="60" y="75" class="lbl-bold" fill="#2563eb">R'<tspan font-size="12" dy="4">O</tspan></text><path d="M 60 57 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" /></g>
  
  <line x1="160" y1="150" x2="220" y2="40" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <path d="M 205 75 A 15 15 0 0 1 228 85" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <g>
    <text x="235" y="45" class="lbl-bold" fill="#dc2626">M<tspan font-size="12" dy="-5">O</tspan></text>
    <path d="M 235 27 h 16 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" />
  </g>
  
  <!-- Dấu tương đương -->
  <text x="315" y="145" font-size="30" fill="#64748b">≡</text>
  
  <!-- Hình bên phải: Hợp lực duy nhất R cách O đoạn d -->
  <ellipse cx="430" cy="140" rx="90" ry="60" class="solid" />
  <circle cx="400" cy="150" r="4.5" fill="#0f172a" />
  <text x="382" y="165" class="lbl-bold">O</text>
  
  <!-- Đường vuông góc OH = d (từ 400,150 đến 435,115 - góc -45 độ) -->
  <line x1="400" y1="150" x2="435" y2="115" stroke="#16a34a" stroke-width="1.8" />
  <text x="424" y="142" class="lbl-bold" fill="#16a34a">d</text>
  
  <!-- Ký hiệu góc vuông 90 độ chuẩn xác tại H(435, 115) -->
  <polyline points="428.6,121.4 422.2,115.0 428.6,108.6" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Đường tác dụng của R (vuông góc với OH: hướng -135 độ) -->
  <line x1="455" y1="135" x2="370" y2="50" class="axis" />
  <line x1="435" y1="115" x2="382" y2="62" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arrow-red)" />
  <g><text x="360" y="55" class="lbl-bold" fill="#dc2626">R</text><path d="M 360 37 h 14 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" /></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-axis" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 15px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 17px; font-style: italic; font-weight: bold; fill: #0f172a; }
  </style>

  <!-- Hệ trục tọa độ Oxy với Ox là trục đối xứng của cung tròn -->
  <line x1="70" y1="135" x2="380" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <line x1="110" y1="240" x2="110" y2="25" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)" />
  <text x="386" y="139" class="lbl">x</text>
  <text x="102" y="22" class="lbl">y</text>
  <circle cx="110" cy="135" r="4" fill="#0f172a" />
  <text x="92" y="152" class="lbl-bold">O</text>

  <!-- Bán kính OA và OB tạo góc ±alpha = ±50° quanh Ox (R = 140) -->
  <!-- A(110 + 140*cos50, 135 - 140*sin50) = (200, 27.8), B = (200, 242.2) -->
  <line x1="110" y1="135" x2="200" y2="27.8" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3" />
  <line x1="110" y1="135" x2="200" y2="242.2" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3" />

  <!-- Cung tròn đồng chất AB bán kính R = 140 -->
  <path d="M 200 27.8 A 140 140 0 0 1 200 242.2" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
  <circle cx="200" cy="27.8" r="4" fill="#0284c7" />
  <text x="208" y="28" class="lbl-bold" fill="#0284c7">A</text>
  <circle cx="200" cy="242.2" r="4" fill="#0284c7" />
  <text x="208" y="248" class="lbl-bold" fill="#0284c7">B</text>

  <!-- Góc ở tâm alpha và phần tử vi phân ds = R dphi tại góc phi -->
  <path d="M 155 135 A 45 45 0 0 0 138.9 100.5" fill="none" stroke="#475569" stroke-width="1.2" />
  <text x="160" y="118" class="lbl">α</text>
  <path d="M 155 135 A 45 45 0 0 1 138.9 169.5" fill="none" stroke="#475569" stroke-width="1.2" />
  <text x="160" y="158" class="lbl">α</text>

  <!-- Trọng tâm C nằm trên trục đối xứng Ox tại x_C = R * sin(alpha)/alpha -->
  <circle cx="233" cy="135" r="5" fill="#dc2626" />
  <text x="233" y="122" class="lbl-bold" fill="#dc2626" text-anchor="middle">C (trọng tâm)</text>
  <text x="275" y="168" class="lbl-bold" fill="#dc2626">x<tspan font-size="11" dy="3">C</tspan><tspan dy="-3"> = R·(sinα / α)</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-sub { font-size: 13px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <!-- Mặt tiếp xúc sàn -->
  <line x1="50" y1="230" x2="390" y2="230" stroke="#1e293b" stroke-width="2" />
  <rect x="50" y="230" width="340" height="15" fill="url(#hatch)" stroke="#64748b" />
  
  <circle cx="220" cy="230" r="4.5" fill="#0f172a" />
  <text x="225" y="248" class="lbl-bold">A</text>
  
  <!-- Nón ma sát (tam giác góc phi) -->
  <polygon points="220,230 140,50 300,50" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4,3" />
  <ellipse cx="220" cy="50" rx="80" ry="15" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4,3" />
  
  <!-- Pháp tuyến N thẳng đứng -->
  <line x1="220" y1="230" x2="220" y2="40" class="axis" />
  <line x1="220" y1="230" x2="220" y2="90" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <text x="225" y="85" class="lbl-bold" fill="#2563eb">N&#8407;</text>
  
  <!-- Lực ma sát F_ms -->
  <line x1="220" y1="230" x2="140" y2="230" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)" />
  <text x="135" y="220" class="lbl-bold" fill="#2563eb">F&#8407;<tspan font-size="12" dy="4">ms</tspan></text>
  
  <!-- Phản lực toàn phần R = N + Fms nằm trên mép nón -->
  <line x1="220" y1="230" x2="140" y2="90" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="120" y="90" class="lbl-bold" fill="#dc2626">R&#8407;</text>
  
  <!-- Góc ma sát phi -->
  <path d="M 220 160 A 70 70 0 0 0 178 170" fill="none" stroke="#dc2626" stroke-width="1.5" />
  <text x="185" y="150" class="lbl-bold" fill="#dc2626">&#966;</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16a34a" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Đường pháp tuyến va chạm nằm ngang n-n -->
  <line x1="40" y1="110" x2="420" y2="110" class="axis" />

  <!-- Quả cầu 1 tại (160, 110) -->
  <circle cx="160" cy="110" r="32" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" />
  <circle cx="160" cy="110" r="3" fill="#1d4ed8" />
  <text x="150" y="115" class="lbl-bold">m₁</text>

  <!-- Quả cầu 2 tại (270, 110) -->
  <circle cx="270" cy="110" r="24" fill="#fed7aa" stroke="#c2410c" stroke-width="2" />
  <circle cx="270" cy="110" r="3" fill="#c2410c" />
  <text x="262" y="115" class="lbl-bold">m₂</text>

  <!-- Vận tốc trước va chạm v1, v2 -->
  <line x1="160" y1="65" x2="215" y2="65" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="175" y="55" class="lbl-bold" fill="#2563eb">v₁</text>

  <line x1="270" y1="65" x2="310" y2="65" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="280" y="55" class="lbl-bold" fill="#2563eb">v₂</text>

  <!-- Xung lực va chạm S tiếp xúc giữa hai quả cầu -->
  <line x1="216" y1="150" x2="185" y2="150" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="180" y="170" class="lbl-bold" fill="#dc2626">-S</text>

  <line x1="216" y1="150" x2="245" y2="150" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="240" y="170" class="lbl-bold" fill="#dc2626">+S</text>

  <!-- Hệ số phục hồi k -->
  <text x="195" y="195" class="lbl-bold" fill="#0f172a">k = (u₂ - u₁) / (v₁ - v₂)</text>
</svg>
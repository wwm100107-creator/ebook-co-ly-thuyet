<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 225" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Đường pháp tuyến va chạm nằm ngang n-n và tiếp tuyến chung t-t tại điểm tiếp xúc (216, 110) -->
  <line x1="40" y1="110" x2="420" y2="110" class="axis" />
  <line x1="216" y1="35" x2="216" y2="175" class="axis" />
  <text x="405" y="102" font-size="13" fill="#64748b">n</text>
  <text x="222" y="45" font-size="13" fill="#64748b">t</text>

  <!-- Quả cầu 1 tại (184, 110), bán kính r1=32 -> tiếp xúc tại x = 184 + 32 = 216 -->
  <circle cx="184" cy="110" r="32" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" />
  <circle cx="184" cy="110" r="3" fill="#1d4ed8" />
  <text x="172" y="128" class="lbl-bold">m<tspan font-size="12" dy="3">1</tspan></text>

  <!-- Quả cầu 2 tại (240, 110), bán kính r2=24 -> tiếp xúc tại x = 240 - 24 = 216 -->
  <circle cx="240" cy="110" r="24" fill="#fed7aa" stroke="#c2410c" stroke-width="2" />
  <circle cx="240" cy="110" r="3" fill="#c2410c" />
  <text x="232" y="126" class="lbl-bold">m<tspan font-size="12" dy="3">2</tspan></text>

  <!-- Điểm tiếp xúc va chạm K(216, 110) -->
  <circle cx="216" cy="110" r="3.5" fill="#dc2626" />

  <!-- Vận tốc trước va chạm v1, v2 -->
  <line x1="155" y1="62" x2="205" y2="62" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="172" y="54" class="lbl-bold" fill="#2563eb">v<tspan font-size="12" dy="3">1</tspan></text>

  <line x1="235" y1="62" x2="275" y2="62" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="248" y="54" class="lbl-bold" fill="#2563eb">v<tspan font-size="12" dy="3">2</tspan></text>

  <!-- Xung lực va chạm -S và +S đặt tại điểm tiếp xúc K(216, 110) dọc pháp tuyến -->
  <line x1="216" y1="110" x2="140" y2="110" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)" />
  <text x="122" y="103" class="lbl-bold" fill="#dc2626">−S</text>

  <line x1="216" y1="110" x2="292" y2="110" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)" />
  <text x="296" y="103" class="lbl-bold" fill="#dc2626">+S</text>

  <!-- Hệ số phục hồi k -->
  <text x="145" y="205" class="lbl-bold" fill="#0f172a">k = (u<tspan font-size="12" dy="3">2</tspan><tspan dy="-3"> − u</tspan><tspan font-size="12" dy="3">1</tspan><tspan dy="-3">) / (v</tspan><tspan font-size="12" dy="3">1</tspan><tspan dy="-3"> − v</tspan><tspan font-size="12" dy="3">2</tspan><tspan dy="-3">)</tspan></text>
</svg>

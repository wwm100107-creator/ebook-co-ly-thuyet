<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
  </style>

  <!-- Ống hoặc rãnh thẳng quay quanh trục cố định O(100, 180) -->
  <line x1="100" y1="180" x2="380" y2="60" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <line x1="100" y1="180" x2="380" y2="60" stroke="#f8fafc" stroke-width="2.5" />
  
  <circle cx="100" cy="180" r="5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5" />
  <text x="80" y="195" class="lbl-bold">O</text>

  <!-- Viên bi M chuyển động dọc theo ống -->
  <circle cx="240" cy="120" r="8" fill="#f97316" stroke="#c2410c" stroke-width="2" />
  <text x="235" y="105" class="lbl-bold">M</text>

  <!-- Vận tốc tương đối v_r dọc theo rãnh -->
  <line x1="240" y1="120" x2="295" y2="96" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="300" y="90" class="lbl-bold" fill="#2563eb">v<tspan font-size="12" dy="3">r</tspan></text>

  <!-- Lực quán tính Coriolis F_Cor = -2m(omega x v_r) vuông góc với rãnh -->
  <line x1="240" y1="120" x2="216" y2="65" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="172" y="60" class="lbl-bold" fill="#dc2626">F<tspan font-size="12" dy="3">Cor</tspan></text>

  <!-- Quay với vận tốc góc omega -->
  <path d="M 140 180 A 40 40 0 0 1 135 150" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <text x="145" y="160" class="lbl-bold" fill="#2563eb">ω</text>
</svg>
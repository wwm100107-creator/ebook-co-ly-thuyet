<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <pattern id="hatch5" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Thanh trượt ngang hướng x -->
  <line x1="40" y1="50" x2="420" y2="50" stroke="#1e293b" stroke-width="2" />
  <rect x="40" y="35" width="380" height="15" fill="url(#hatch5)" stroke="#94a3b8" />

  <!-- Con trượt A khối lượng M tại vị trí x -->
  <rect x="180" y="42" width="60" height="26" rx="3" fill="#cbd5e1" stroke="#1e293b" stroke-width="2" />
  <text x="195" y="60" class="lbl-bold">M</text>

  <!-- Khớp bản lề treo thanh lắc tại (210, 55) -->
  <circle cx="210" cy="55" r="4.5" fill="#2563eb" />
  
  <!-- Tọa độ suy rộng x -->
  <line x1="70" y1="25" x2="210" y2="25" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <text x="135" y="20" class="lbl-bold" fill="#2563eb">q₁ = x</text>

  <!-- Đường thẳng đứng qua bản lề A -->
  <line x1="210" y1="55" x2="210" y2="210" class="axis" />

  <!-- Thanh lắc chiều dài l nghiêng góc phi mang quả nặng m -->
  <line x1="210" y1="55" x2="300" y2="190" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <circle cx="300" cy="190" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2" />
  <text x="315" y="195" class="lbl-bold">m</text>
  <text x="260" y="115" class="lbl-bold">l</text>

  <!-- Tọa độ suy rộng phi -->
  <path d="M 210 110 A 55 55 0 0 0 238 100" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <text x="225" y="130" class="lbl-bold" fill="#2563eb">q₂ = φ</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6,3; }
  </style>

  <!-- Trục quay thẳng đứng AB -->
  <line x1="180" y1="30" x2="180" y2="230" class="axis" />
  
  <!-- Ổ đỡ A tại (180, 50) và ổ chặn B tại (180, 210) -->
  <rect x="165" y="40" width="30" height="20" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" />
  <circle cx="180" cy="50" r="4" fill="#0f172a" />
  <text x="140" y="55" class="lbl-bold">A</text>

  <rect x="165" y="200" width="30" height="20" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" />
  <circle cx="180" cy="210" r="4" fill="#0f172a" />
  <text x="140" y="215" class="lbl-bold">B</text>

  <!-- Cánh tay đòn gắn chất điểm lệch tâm M tại z_M = 130 -->
  <line x1="180" y1="130" x2="300" y2="130" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <circle cx="300" cy="130" r="9" fill="#2563eb" stroke="#1e293b" stroke-width="2" />
  <text x="315" y="135" class="lbl-bold">M (m)</text>
  <text x="235" y="122" class="lbl-bold">r</text>

  <!-- Lực quán tính ly tâm F_qt = m*omega^2*r hướng ra xa trục -->
  <line x1="300" y1="130" x2="390" y2="130" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red)" />
  <text x="340" y="152" class="lbl-bold" fill="#dc2626">F<tspan font-size="12" dy="3">qt</tspan></text>

  <!-- Vận tốc góc omega quay quanh trục AB -->
  <path d="M 160 80 A 25 15 0 1 1 200 80" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <text x="210" y="85" class="lbl-bold" fill="#2563eb">ω</text>

  <!-- Phản lực động tại các ổ trục X_A, X_B hướng ngược lại để cân bằng F_qt -->
  <line x1="180" y1="50" x2="110" y2="50" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="95" y="42" class="lbl-bold" fill="#dc2626">X<tspan font-size="12" dy="3">A</tspan><tspan font-size="12" dy="-9">(đ)</tspan></text>

  <line x1="180" y1="210" x2="110" y2="210" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="95" y="202" class="lbl-bold" fill="#dc2626">X<tspan font-size="12" dy="3">B</tspan><tspan font-size="12" dy="-9">(đ)</tspan></text>
</svg>
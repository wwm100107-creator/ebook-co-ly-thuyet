<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16a34a" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 15px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 17px; font-style: italic; font-weight: bold; fill: #0f172a; }
  </style>

  <!-- Mặt phẳng ngang cố định Q -->
  <polygon points="40,225 440,225 500,165 110,165" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Trục thẳng đứng Oz qua đỉnh cố định O(160, 195) -->
  <line x1="160" y1="245" x2="160" y2="25" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />
  <text x="142" y="32" class="lbl-bold" fill="#2563eb">z</text>

  <!-- Vận tốc góc tiến động omega_1 dọc theo Oz -->
  <line x1="160" y1="195" x2="160" y2="85" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)" />
  <text x="128" y="95" class="lbl-bold" fill="#2563eb">ω<tspan font-size="11" dy="3">1</tspan></text>

  <!-- Đường sinh tiếp xúc OA trên mặt phẳng ngang (trục quay tức thời OP): từ O(160, 195) đến A(380, 195) -->
  <line x1="160" y1="195" x2="430" y2="195" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6,3" />
  <text x="415" y="214" class="lbl-bold" fill="#dc2626">Trục tức thời OP</text>

  <!-- Hình nón động đỉnh O(160, 195), đường sinh dưới OA(380, 195), trục đối xứng OC(350, 118), đường sinh trên OB(320, 41) -->
  <polygon points="160,195 380,195 320,41" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="2.2" />
  <!-- Đáy nón elip đi qua A(380, 195), tâm C(350, 118), đỉnh B(320, 41) -->
  <g transform="translate(350, 118) rotate(-21.8)">
    <ellipse cx="0" cy="0" rx="22" ry="82.6" fill="rgba(2, 132, 199, 0.18)" stroke="#0284c7" stroke-width="2.2" />
    <circle cx="0" cy="0" r="3.5" fill="#0f172a" />
  </g>

  <!-- Trục hình học OC của nón: từ O(160, 195) qua C(350, 118) -->
  <line x1="160" y1="195" x2="395" y2="100" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="362" y="128" class="lbl-bold">C</text>

  <!-- Đỉnh cố định O, điểm tiếp xúc A, điểm cao nhất B -->
  <circle cx="160" cy="195" r="4.5" fill="#0f172a" />
  <text x="140" y="212" class="lbl-bold">O</text>

  <circle cx="380" cy="195" r="4" fill="#dc2626" />
  <text x="378" y="215" class="lbl-bold" fill="#dc2626">A (v<tspan font-size="11" dy="3">A</tspan><tspan dy="-3"> = 0)</tspan></text>

  <circle cx="320" cy="41" r="4" fill="#0f172a" />
  <text x="302" y="36" class="lbl-bold">B</text>

  <!-- Góc nửa ở đỉnh α giữa OA và OC, và góc α giữa OC và OB -->
  <path d="M 225 195 A 65 65 0 0 0 220.4 170.5" fill="none" stroke="#1e293b" stroke-width="1.3" />
  <text x="232" y="186" class="lbl">α</text>

  <!-- Vectơ vận tốc góc tuyệt đối ω nằm dọc theo đường sinh tiếp xúc OA -->
  <line x1="160" y1="195" x2="295" y2="195" stroke="#dc2626" stroke-width="2.8" marker-end="url(#arr-red)" />
  <text x="275" y="186" class="lbl-bold" fill="#dc2626">ω</text>

  <!-- Vectơ vận tốc riêng ω_2 dọc theo CO -->
  <line x1="275" y1="148.4" x2="160" y2="195" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-green)" />
  <text x="235" y="152" class="lbl-bold" fill="#16a34a">ω<tspan font-size="11" dy="3">2</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16a34a" />
    </marker>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
  </style>

  <!-- Gối cố định O1(95, 222) và O2(350, 222) -->
  <polygon points="95,222 83,238 107,238" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="95" cy="222" r="4.5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
  <text x="65" y="232" class="lbl-bold">O<tspan font-size="12" dy="3">1</tspan></text>

  <polygon points="350,222 338,238 362,238" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="350" cy="222" r="4.5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
  <text x="368" y="232" class="lbl-bold">O<tspan font-size="12" dy="3">2</tspan></text>

  <!-- Khâu dẫn O1A: từ O1(95, 222) qua A(155, 122) thẳng hàng tới P(215, 22) -->
  <line x1="95" y1="222" x2="155" y2="122" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="155" cy="122" r="4.5" fill="#0f172a"/>
  <text x="132" y="120" class="lbl-bold">A</text>

  <!-- Khâu bị dẫn O2B: từ O2(350, 222) qua B(290, 133) thẳng hàng tới P(215, 22) -->
  <line x1="350" y1="222" x2="290" y2="133" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="290" cy="133" r="4.5" fill="#0f172a"/>
  <text x="302" y="132" class="lbl-bold">B</text>

  <!-- Thanh truyền AB nối A(155, 122) và B(290, 133) -->
  <line x1="155" y1="122" x2="290" y2="133" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

  <!-- Hai tia kéo dài O1A và O2B giao nhau chính xác tại tâm vận tốc tức thời P(215, 22) -->
  <line x1="155" y1="122" x2="215" y2="22" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,3"/>
  <line x1="290" y1="133" x2="215" y2="22" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,3"/>
  <circle cx="215" cy="22" r="5" fill="#dc2626"/>
  <text x="225" y="26" class="lbl-bold" fill="#dc2626">P (Tâm VTTT)</text>

  <!-- Vectơ vận tốc v_A vuông góc với O1A tại A(155, 122) -->
  <line x1="155" y1="122" x2="205" y2="152" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arr-green)"/>
  <text x="195" y="170" class="lbl-bold" fill="#16a34a">v<tspan font-size="12" dy="3">A</tspan></text>

  <!-- Vectơ vận tốc v_B vuông góc với O2B tại B(290, 133) -->
  <line x1="290" y1="133" x2="334" y2="103" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arr-blue)"/>
  <text x="340" y="106" class="lbl-bold" fill="#2563eb">v<tspan font-size="12" dy="3">B</tspan></text>

  <!-- Chiều quay tức thời omega_AB quanh P -->
  <path d="M 192 50 A 32 32 0 0 0 236 50" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="242" y="55" class="lbl-bold" fill="#dc2626">ω<tspan font-size="11" dy="3">AB</tspan></text>
</svg>

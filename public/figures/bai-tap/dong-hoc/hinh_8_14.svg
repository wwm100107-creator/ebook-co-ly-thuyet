<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <pattern id="gnd-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 15px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 17px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .ray { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Móng cố định O1 và O2 -->
  <line x1="60" y1="220" x2="120" y2="220" stroke="#1e293b" stroke-width="2" />
  <rect x="60" y="220" width="60" height="15" fill="url(#gnd-hatch)" stroke="#475569" stroke-width="1" />
  <circle cx="90" cy="210" r="5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5" />
  <text x="68" y="212" class="lbl-bold">O<tspan font-size="12">1</tspan></text>

  <line x1="310" y1="220" x2="370" y2="220" stroke="#1e293b" stroke-width="2" />
  <rect x="310" y="220" width="60" height="15" fill="url(#gnd-hatch)" stroke="#475569" stroke-width="1" />
  <circle cx="340" cy="210" r="5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5" />
  <text x="350" y="212" class="lbl-bold">O<tspan font-size="12">2</tspan></text>

  <!-- Khâu dẫn O1A nghiêng từ (90, 210) đến A(150, 100) -->
  <line x1="90" y1="210" x2="150" y2="100" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="150" cy="100" r="5" fill="#0f172a" />
  <text x="135" y="95" class="lbl-bold">A</text>

  <!-- Khâu bị dẫn O2B từ (340, 210) đến B(290, 110) -->
  <line x1="340" y1="210" x2="290" y2="110" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="290" cy="110" r="5" fill="#0f172a" />
  <text x="300" y="105" class="lbl-bold">B</text>

  <!-- Khâu truyền động song phẳng AB nối A(150, 100) và B(290, 110) -->
  <line x1="150" y1="100" x2="290" y2="110" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

  <!-- Đường kéo dài O1A và O2B cắt nhau tại tâm vận tốc tức thời P -->
  <line x1="150" y1="100" x2="190" y2="26.7" class="ray" />
  <line x1="290" y1="110" x2="250" y2="30" class="ray" />
  <!-- Giao điểm P: x_P ~ 205, y_P ~ 0 hoặc gần đỉnh -->
  <circle cx="215" cy="20" r="4.5" fill="#dc2626" />
  <text x="225" y="25" class="lbl-bold" fill="#dc2626">P (CV)</text>
  <line x1="150" y1="100" x2="215" y2="20" class="ray" stroke="#dc2626" />
  <line x1="290" y1="110" x2="215" y2="20" class="ray" stroke="#dc2626" />

  <!-- Vectơ vận tốc vA và vB vuông góc với tay quay -->
  <!-- vA vuông góc với O1A: hướng lên sang phải -->
  <line x1="150" y1="100" x2="200" y2="73" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="185" y="65" class="lbl-bold" fill="#2563eb">v<tspan font-size="12">A</tspan></text>

  <!-- vB vuông góc với O2B: hướng lên sang trái -->
  <line x1="290" y1="110" x2="245" y2="87.5" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="235" y="80" class="lbl-bold" fill="#2563eb">v<tspan font-size="12">B</tspan></text>
</svg>
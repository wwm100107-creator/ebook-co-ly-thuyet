<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <pattern id="wall-3d" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Mặt phẳng tường nghiêng phối cảnh Oyz -->
  <polygon points="40,20 180,20 180,250 40,250" fill="url(#wall-3d)" stroke="#64748b" stroke-width="1.2" />
  
  <!-- Các điểm gắn tường A, B, C tạo thành tam giác đều ABC trên tường -->
  <!-- A(130, 50), B(60, 220), C(180, 220) -->
  <line x1="130" y1="50" x2="60" y2="220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="60" y1="220" x2="180" y2="220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="180" y1="220" x2="130" y2="50" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />

  <circle cx="130" cy="50" r="4.5" fill="#0f172a" />
  <text x="125" y="40" class="lbl-bold">A</text>
  <circle cx="60" cy="220" r="4.5" fill="#0f172a" />
  <text x="45" y="235" class="lbl-bold">B</text>
  <circle cx="180" cy="220" r="4.5" fill="#0f172a" />
  <text x="185" y="235" class="lbl-bold">C</text>

  <!-- Đỉnh O trong không gian vươn ra ngoài: O(360, 140) -->
  <line x1="130" y1="50" x2="360" y2="140" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" />
  <line x1="60" y1="220" x2="360" y2="140" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" />
  <line x1="180" y1="220" x2="360" y2="140" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" />

  <circle cx="360" cy="140" r="5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5" />
  <text x="372" y="145" class="lbl-bold">O</text>

  <!-- Trọng lực P thẳng đứng hướng xuống tại O -->
  <line x1="360" y1="140" x2="360" y2="235" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red)" />
  <rect x="350" y="235" width="20" height="20" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5" />
  <text x="356" y="250" font-size="13" font-weight="bold" fill="#dc2626">P</text>

  <!-- Các ứng lực SA, SB, SC dọc theo các thanh -->
  <line x1="360" y1="140" x2="270" y2="105" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="275" y="95" class="lbl-bold" fill="#2563eb">S<tspan font-size="12">A</tspan></text>

  <line x1="360" y1="140" x2="240" y2="172" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="250" y="165" class="lbl-bold" fill="#2563eb">S<tspan font-size="12">B</tspan></text>

  <line x1="360" y1="140" x2="280" y2="172" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="300" y="185" class="lbl-bold" fill="#2563eb">S<tspan font-size="12">C</tspan></text>
</svg>
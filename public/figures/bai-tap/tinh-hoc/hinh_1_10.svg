<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <pattern id="hatch-ngam" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
  </style>

  <!-- Tường ngàm tại A -->
  <rect x="35" y="40" width="25" height="150" fill="url(#hatch-ngam)" stroke="#475569" stroke-width="1.5" />
  <line x1="60" y1="40" x2="60" y2="190" stroke="#1e293b" stroke-width="2.5" />

  <!-- Dầm mái hiên AB dài 320px (từ x=60 đến x=380, y=130) -->
  <line x1="60" y1="130" x2="380" y2="130" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
  <text x="45" y="125" class="lbl-bold">A</text>
  <text x="385" y="135" class="lbl-bold">B</text>

  <!-- Mái hiên tam giác chịu tải phân bố q đều: vẽ hình tam giác -->
  <polygon points="60,80 380,130 60,130" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" opacity="0.7" />
  <!-- Các mũi tên phân bố tam giác hướng xuống -->
  <line x1="90" y1="85" x2="90" y2="130" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)" />
  <line x1="140" y1="92" x2="140" y2="130" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)" />
  <line x1="190" y1="100" x2="190" y2="130" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)" />
  <line x1="240" y1="108" x2="240" y2="130" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)" />
  <line x1="290" y1="116" x2="290" y2="130" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)" />
  <line x1="340" y1="124" x2="340" y2="130" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-blue)" />
  <text x="95" y="75" class="lbl" fill="#0284c7">q (cường độ tại A)</text>

  <!-- Trọng lực bản thân P đặt tại trọng tâm dầm (x = 60 + 160 = 220) -->
  <line x1="220" y1="130" x2="220" y2="195" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)" />
  <text x="228" y="190" class="lbl-bold" fill="#dc2626">P</text>

  <!-- Tải trọng tập trung Q tại đầu tự do B -->
  <line x1="380" y1="130" x2="380" y2="200" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)" />
  <text x="390" y="195" class="lbl-bold" fill="#dc2626">Q</text>

  <!-- Hợp lực tải phân bố Q1 đặt tại 1/3 từ A: x = 60 + 320/3 = 167 -->
  <line x1="167" y1="65" x2="167" y2="130" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="3,2" marker-end="url(#arr-blue)" />
  <text x="175" y="80" class="lbl-bold" fill="#2563eb">Q<tspan font-size="12">1</tspan></text>

  <!-- Phản lực ngàm tại A: XA, YA và mômen ngàm MA -->
  <line x1="60" y1="130" x2="105" y2="130" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="100" y="122" class="lbl-bold" fill="#16a34a">X<tspan font-size="12">A</tspan></text>
  
  <line x1="60" y1="130" x2="60" y2="75" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="68" y="85" class="lbl-bold" fill="#16a34a">Y<tspan font-size="12">A</tspan></text>

  <!-- Ngẫu lực mômen ngàm MA -->
  <path d="M 45 105 A 25 25 0 1 1 45 155" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="15" y="165" class="lbl-bold" fill="#16a34a">M<tspan font-size="12">A</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <pattern id="box-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Hộp: thành trái, đáy, thành phải -->
  <rect x="70" y="30" width="20" height="220" fill="url(#box-hatch)" stroke="#475569" stroke-width="1.2" />
  <line x1="90" y1="30" x2="90" y2="250" stroke="#1e293b" stroke-width="2.5" />

  <rect x="70" y="250" width="280" height="20" fill="url(#box-hatch)" stroke="#475569" stroke-width="1.2" />
  <line x1="90" y1="250" x2="350" y2="250" stroke="#1e293b" stroke-width="2.5" />

  <rect x="330" y="30" width="20" height="220" fill="url(#box-hatch)" stroke="#475569" stroke-width="1.2" />
  <line x1="330" y1="30" x2="330" y2="250" stroke="#1e293b" stroke-width="2.5" />

  <!-- Quả cầu 1: tâm O1(160, 180), R=70. Tiếp xúc thành trái tại (90, 180) và đáy tại (160, 250) -->
  <circle cx="160" cy="180" r="70" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2" />
  <circle cx="160" cy="180" r="4.5" fill="#2563eb" />
  <text x="145" y="175" class="lbl-bold">O<tspan font-size="12">1</tspan></text>

  <!-- Quả cầu 2: đường nối tâm nghiêng 45 độ. R1=R2=70. Khoảng cách O1O2 = 2R = 140 -->
  <!-- dx = 140 * cos(45) = 99, dy = -99 => O2(259, 81). Tiếp xúc thành phải tại x=330 (259+70=329~330) -->
  <circle cx="260" cy="81" r="70" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2" />
  <circle cx="260" cy="81" r="4.5" fill="#2563eb" />
  <text x="270" y="75" class="lbl-bold">O<tspan font-size="12">2</tspan></text>

  <!-- Đường nối tâm O1O2 và góc 45 độ -->
  <line x1="160" y1="180" x2="260" y2="81" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="160" y1="180" x2="260" y2="180" class="axis" />
  <path d="M 195 180 A 35 35 0 0 0 185 155" fill="none" stroke="#0f172a" stroke-width="1.2" />
  <text x="195" y="165" font-size="13">45°</text>

  <!-- Các lực tác dụng -->
  <!-- Lực ép tương hỗ N và N' tại tiếp điểm (210, 130.5) -->
  <line x1="210" y1="130.5" x2="180" y2="160" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="175" y="145" class="lbl-bold" fill="#dc2626">N</text>
  
  <line x1="210" y1="130.5" x2="240" y2="101" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)" />
  <text x="235" y="125" class="lbl-bold" fill="#dc2626">N'</text>

  <!-- Phản lực thành trái N1 tại (90, 180) -->
  <line x1="90" y1="180" x2="130" y2="180" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="100" y="172" class="lbl-bold" fill="#2563eb">N<tspan font-size="12">1</tspan></text>

  <!-- Phản lực thành phải N2 tại (330, 81) -->
  <line x1="330" y1="81" x2="290" y2="81" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="305" y="72" class="lbl-bold" fill="#2563eb">N<tspan font-size="12">2</tspan></text>

  <!-- Phản lực đáy N3 tại (160, 250) -->
  <line x1="160" y1="250" x2="160" y2="215" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)" />
  <text x="168" y="235" class="lbl-bold" fill="#2563eb">N<tspan font-size="12">3</tspan></text>

  <!-- Trọng lực P1 và P2 -->
  <line x1="160" y1="180" x2="160" y2="240" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="145" y="225" class="lbl-bold" fill="#dc2626">P<tspan font-size="12">1</tspan></text>
  <line x1="260" y1="81" x2="260" y2="140" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="268" y="125" class="lbl-bold" fill="#dc2626">P<tspan font-size="12">2</tspan></text>
</svg>
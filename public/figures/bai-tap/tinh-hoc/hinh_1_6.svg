<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="auto">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: #0f172a; }
    .bold { font-weight: bold; }
  </style>

  <!-- Tường thẳng đứng tại x=245 -->
  <rect x="245" y="25" width="22" height="230" fill="url(#hatch)" stroke="#64748b" stroke-width="1"/>
  <line x1="245" y1="25" x2="245" y2="255" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Quả cầu tâm O(160, 155), bán kính R=85 tiếp xúc tường tại C(245, 155) -->
  <circle cx="160" cy="155" r="85" fill="#f1f5f9" stroke="#0284c7" stroke-width="2.5"/>
  <circle cx="160" cy="155" r="4" fill="#0f172a"/>
  <text x="142" y="152" class="bold">O</text>

  <!-- Điểm tiếp xúc C(245, 155) -->
  <circle cx="245" cy="155" r="3.5" fill="#1e293b"/>
  <text x="252" y="160" class="bold">C</text>

  <!-- Điểm treo A(245, 35) trên tường; đoạn OA có dx=85, dy=-120, dài 147, cắt mặt cầu R=85 tại B(209.1, 85.6) -->
  <circle cx="245" cy="35" r="4" fill="#0f172a"/>
  <text x="253" y="40" class="bold">A</text>
  <circle cx="209.1" cy="85.6" r="4" fill="#0284c7"/>
  <text x="190" y="80" class="bold">B</text>

  <!-- Đường kéo dài OB nét đứt từ O(160,155) đến B(209.1,85.6) -->
  <line x1="160" y1="155" x2="209.1" y2="85.6" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Dây treo AB nét liền từ B(209.1,85.6) đến A(245,35) -->
  <line x1="209.1" y1="85.6" x2="245" y2="35" stroke="#1e293b" stroke-width="2.2"/>

  <!-- Góc alpha giữa dây AB và tường tại A -->
  <path d="M 245 75 A 40 40 0 0 1 221.9 67.6" fill="none" stroke="#475569" stroke-width="1.3"/>
  <text x="225" y="88" font-size="14">α</text>

  <!-- Trọng lực P thẳng đứng xuống từ O -->
  <line x1="160" y1="155" x2="160" y2="255" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)"/>
  <text x="168" y="252" class="bold" fill="#dc2626">P</text>

  <!-- Phản lực pháp tuyến N_C từ C hướng qua O -->
  <line x1="245" y1="155" x2="80" y2="155" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="82" y="145" class="bold" fill="#2563eb">N<tspan font-size="11" dy="3">C</tspan></text>

  <!-- Lực căng dây T dọc theo BA -->
  <line x1="209.1" y1="85.6" x2="235" y2="49.1" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="202" y="58" class="bold" fill="#16a34a">T</text>
</svg>

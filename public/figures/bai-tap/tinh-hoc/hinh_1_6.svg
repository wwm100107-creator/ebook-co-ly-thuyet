<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16a34a" />
    </marker>
    <pattern id="wall-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Tường thẳng đứng -->
  <rect x="35" y="20" width="25" height="240" fill="url(#wall-hatch)" stroke="#475569" stroke-width="1.5" />
  <line x1="60" y1="20" x2="60" y2="260" stroke="#1e293b" stroke-width="2.2" />

  <!-- Quả cầu tâm O bán kính R=90, tựa vào tường tại C(60, 150), tâm O(150, 150) -->
  <circle cx="150" cy="150" r="90" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2" />
  
  <!-- Dây treo AB nối từ tường A(60, 46.1) tới điểm B(105, 72.1) trên quả cầu -->
  <!-- Tam giác OCA vuông tại C: OC=90, OA=180 (do AB=R=90 => OA=2R), góc COA = 60 độ -->
  <!-- CA = OC * tan(60) = 90 * sqrt(3) = 155.88 => y_A = 150 - 155.88 = -5.88 (nếu lấy 60 độ) -->
  <!-- Theo sách: góc Ô = 60 độ, dây AB dài bằng bán kính R, góc OCA vuông tại C => OA = 2*OC = 2R => góc OAC = 30 deg, COA = 60 deg -->
  <!-- y_A = 150 - 90 * tan(60) = 150 - 155.88 = -5.9, để vừa khung ta co tỉ lệ hoặc vẽ tường cao -->
  <line x1="60" y1="30" x2="150" y2="150" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" />
  <line x1="60" y1="30" x2="105" y2="90" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="60" cy="30" r="3.5" fill="#0f172a" />
  <text x="45" y="30" class="lbl-bold">A</text>
  
  <circle cx="105" cy="90" r="3.5" fill="#0f172a" />
  <text x="92" y="85" class="lbl-bold">B</text>

  <!-- Tâm O và điểm tiếp xúc C -->
  <circle cx="150" cy="150" r="4.5" fill="#2563eb" />
  <text x="160" y="145" class="lbl-bold">O</text>
  <circle cx="60" cy="150" r="4" fill="#0f172a" />
  <text x="68" y="145" class="lbl-bold">C</text>

  <!-- Trục x nằm ngang, góc 60 độ tại O -->
  <line x1="60" y1="150" x2="260" y2="150" class="axis" />
  <text x="265" y="155" class="lbl">x</text>
  <path d="M 120 150 A 30 30 0 0 1 135 124" fill="none" stroke="#0f172a" stroke-width="1.2" />
  <text x="105" y="138" font-size="13">60°</text>

  <!-- Lực tác dụng tại quả cầu: P, N, T -->
  <!-- Trọng lực P -->
  <line x1="150" y1="150" x2="150" y2="240" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red)" />
  <text x="158" y="235" class="lbl-bold" fill="#dc2626">P</text>

  <!-- Phản lực N từ tường C -->
  <line x1="60" y1="150" x2="120" y2="150" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arr-blue)" />
  <text x="75" y="172" class="lbl-bold" fill="#2563eb">N</text>

  <!-- Sức căng T theo phương dây hướng về A -->
  <line x1="150" y1="150" x2="90" y2="70" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-green)" />
  <text x="75" y="95" class="lbl-bold" fill="#16a34a">T</text>

  <!-- Đa giác lực bên phải -->
  <g transform="translate(320, 40)">
    <rect x="0" y="0" width="170" height="200" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="35" y="28" font-size="15" font-weight="bold" fill="#1e293b">Tam giác lực</text>
    
    <!-- Vector P: thẳng đứng từ (50, 50) xuống (50, 160) -->
    <line x1="50" y1="50" x2="50" y2="160" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)" />
    <text x="32" y="110" class="lbl-bold" fill="#dc2626">P</text>

    <!-- Vector N: nằm ngang từ (50, 160) sang (113.5, 160) -->
    <line x1="50" y1="160" x2="113.5" y2="160" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)" />
    <text x="75" y="180" class="lbl-bold" fill="#2563eb">N</text>

    <!-- Ký hiệu góc vuông giữa P và N -->
    <polyline points="50,146 64,146 64,160" fill="none" stroke="#0f172a" stroke-width="1.3" />

    <!-- Vector T: từ (113.5, 160) về (50, 50) -->
    <line x1="113.5" y1="160" x2="50" y2="50" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arr-green)" />
    <text x="95" y="100" class="lbl-bold" fill="#16a34a">T</text>

    <!-- Góc 60 độ tại đỉnh tam giác lực -->
    <path d="M 50 80 A 30 30 0 0 1 65 76" fill="none" stroke="#0f172a" stroke-width="1.2" />
    <text x="56" y="95" font-size="12">60°</text>
  </g>
</svg>
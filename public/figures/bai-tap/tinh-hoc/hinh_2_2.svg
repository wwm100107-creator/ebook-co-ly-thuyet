<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <pattern id="wall-hatch4" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Tường thẳng đứng ngàm và bản lề -->
  <rect x="35" y="20" width="25" height="220" fill="url(#wall-hatch4)" stroke="#475569" stroke-width="1.5" />
  <line x1="60" y1="20" x2="60" y2="240" stroke="#1e293b" stroke-width="2.5" />

  <!-- Bản lề O trên tường tại (60, 70) -->
  <circle cx="60" cy="70" r="5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5" />
  <text x="42" y="75" class="lbl-bold">O</text>

  <!-- Dầm OA nằm ngang dài 360px: từ (60, 70) đến (420, 70) -->
  <line x1="60" y1="70" x2="420" y2="70" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <text x="425" y="75" class="lbl-bold">A</text>

  <!-- Điểm B trên dầm OA tại x = 60 + 120 = 180 (vị trí 1/3) -->
  <circle cx="180" cy="70" r="4.5" fill="#0f172a" />
  <text x="180" y="62" class="lbl-bold">B</text>

  <!-- Thanh chống BC ngàm tại C trên tường tại (60, 200), nghiêng 30 độ với tường -->
  <!-- BC nối từ C(60, 200) đến B(180, 70) -->
  <line x1="60" y1="200" x2="180" y2="70" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <circle cx="60" cy="200" r="5" fill="#0f172a" />
  <text x="42" y="205" class="lbl-bold">C</text>

  <!-- Góc 30 độ tại C giữa BC và tường -->
  <path d="M 60 165 A 35 35 0 0 1 83.7 174.3" fill="none" stroke="#0f172a" stroke-width="1.2" />
  <text x="66" y="158" font-size="13">30°</text>

  <!-- Tải trọng P tại giữa OA (x=240) và Q tại đầu A (x=420) -->
  <line x1="240" y1="70" x2="240" y2="140" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)" />
  <text x="248" y="135" class="lbl-bold" fill="#dc2626">P</text>

  <line x1="420" y1="70" x2="420" y2="150" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)" />
  <text x="428" y="145" class="lbl-bold" fill="#dc2626">Q</text>

  <!-- Phản lực liên kết tại B giữa OA và BC: N và N' -->
  <line x1="180" y1="70" x2="180" y2="25" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="188" y="35" class="lbl-bold" fill="#2563eb">N</text>
  
  <line x1="180" y1="70" x2="180" y2="115" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="188" y="110" class="lbl-bold" fill="#2563eb">N'</text>
</svg>
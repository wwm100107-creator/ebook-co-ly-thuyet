<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16a34a" />
    </marker>
    <pattern id="hatch4" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 15px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 16px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .title { font-size: 14px; font-weight: bold; fill: #1e293b; }
  </style>

  <!-- Phần (a): Đai dẹt và Đai hình thang cân trong rãnh chêm góc 2α -->
  <g transform="translate(10, 10)">
    <text x="135" y="18" class="title" text-anchor="middle">a) Rãnh đai hình thang cân (góc chêm 2α)</text>

    <!-- Khối bánh đai có rãnh chữ V -->
    <polygon points="35,55 95,55 120,175 150,175 175,55 235,55 235,215 35,215" fill="url(#hatch4)" stroke="#475569" stroke-width="1.5" />
    <polyline points="35,55 95,55 120,175 150,175 175,55 235,55" fill="none" stroke="#1e293b" stroke-width="2.2" />

    <!-- Tiết diện dây đai hình thang cân -->
    <polygon points="103,95 167,95 153,162 117,162" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <text x="135" y="132" class="lbl-bold" fill="#1d4ed8" text-anchor="middle">Đai</text>

    <!-- Trục đối xứng thẳng đứng và góc chêm 2α -->
    <line x1="135" y1="35" x2="135" y2="235" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" />
    <line x1="95" y1="55" x2="135" y2="245" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="175" y1="55" x2="135" y2="245" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" />
    <path d="M 127 207 A 38 38 0 0 1 143 207" fill="none" stroke="#dc2626" stroke-width="1.3" />
    <text x="135" y="198" class="lbl-bold" fill="#dc2626" text-anchor="middle">2α</text>

    <!-- Lực ép hướng tâm N thẳng đứng xuống -->
    <line x1="135" y1="38" x2="135" y2="92" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arr-red)" />
    <text x="143" y="52" class="lbl-bold" fill="#dc2626">N</text>

    <!-- Phản lực pháp tuyến N1, N2 vuông góc với hai má rãnh nghiêng -->
    <line x1="110" y1="128" x2="158" y2="118" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
    <text x="58" y="128" class="lbl-bold" fill="#2563eb">N<tspan font-size="11" dy="3">1</tspan></text>

    <line x1="160" y1="128" x2="112" y2="118" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
    <text x="192" y="128" class="lbl-bold" fill="#2563eb">N<tspan font-size="11" dy="3">2</tspan></text>

    <text x="135" y="248" font-size="13" font-style="italic" fill="#334155" text-anchor="middle">F<tspan font-size="10" dy="3">ms</tspan><tspan dy="-3"> = f·N / sinα</tspan></text>
  </g>

  <!-- Đường phân cách giữa 2 hình -->
  <line x1="295" y1="20" x2="295" y2="250" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Phần (b): Vật nặng trên mặt phẳng nghiêng có ma sát -->
  <g transform="translate(310, 10)">
    <text x="160" y="18" class="title" text-anchor="middle">b) Cân bằng vật trên mặt nghiêng nhám</text>

    <!-- Mặt phẳng nghiêng góc α: chân dốc (40, 215), đỉnh (280, 95) -->
    <polygon points="30,215 290,215 290,85" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <line x1="20" y1="215" x2="305" y2="215" stroke="#1e293b" stroke-width="2" />
    <path d="M 85 215 A 55 55 0 0 0 79.2 190.4" fill="none" stroke="#475569" stroke-width="1.3" />
    <text x="95" y="206" class="lbl">α</text>

    <!-- Khối vật nặng đặt trên mặt nghiêng tại trung điểm (160, 150), góc dốc -26.565 độ -->
    <g transform="translate(160, 150) rotate(-26.565)">
      <rect x="-32" y="-36" width="64" height="36" rx="3" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" />
      <circle cx="0" cy="-18" r="3.5" fill="#0f172a" />

      <!-- Phản lực pháp tuyến N vuông góc mặt nghiêng -->
      <line x1="0" y1="-18" x2="0" y2="-82" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
      <text x="8" y="-74" class="lbl-bold" fill="#2563eb">N</text>

      <!-- Lực kéo Q dọc lên mặt nghiêng -->
      <line x1="0" y1="-18" x2="68" y2="-18" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arr-green)" />
      <text x="62" y="-26" class="lbl-bold" fill="#16a34a">Q</text>

      <!-- Lực ma sát F_ms dọc theo mặt tiếp xúc -->
      <line x1="0" y1="0" x2="-58" y2="0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)" />
      <text x="-68" y="-8" class="lbl-bold" fill="#dc2626">F<tspan font-size="11" dy="3">ms</tspan></text>
    </g>

    <!-- Trọng lực P thẳng đứng xuống từ khối tâm (151.9, 133.9) -->
    <line x1="151.9" y1="133.9" x2="151.9" y2="205" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arr-red)" />
    <text x="160" y="202" class="lbl-bold" fill="#dc2626">P</text>

    <text x="160" y="248" font-size="13" font-style="italic" fill="#334155" text-anchor="middle">F<tspan font-size="10" dy="3">ms</tspan><tspan dy="-3"> ≤ F</tspan><tspan font-size="10" dy="3">gh</tspan><tspan dy="-3"> = f·N</tspan></text>
  </g>
</svg>

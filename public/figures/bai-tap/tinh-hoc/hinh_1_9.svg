<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <pattern id="wall-hatch3" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 16px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 18px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4,3; }
  </style>

  <!-- Tường gạch chéo thẳng đứng -->
  <rect x="35" y="20" width="25" height="200" fill="url(#wall-hatch3)" stroke="#475569" stroke-width="1.5" />
  <line x1="60" y1="20" x2="60" y2="220" stroke="#1e293b" stroke-width="2.2" />

  <!-- Bản lề O trên tường tại (60, 140) -->
  <circle cx="60" cy="140" r="5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5" />
  <text x="42" y="145" class="lbl-bold">O</text>

  <!-- Điểm mỏ neo neo dây C trên tường tại (60, 40) -->
  <circle cx="60" cy="40" r="4" fill="#0f172a" />
  <text x="45" y="45" class="lbl-bold">C</text>

  <!-- Dầm ngang OA từ (60, 140) đến A(400, 140) -->
  <line x1="60" y1="140" x2="400" y2="140" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Điểm B ở vị trí 2/3: OB = 240 => x_B = 300, điểm A tại 380 -->
  <circle cx="300" cy="140" r="4" fill="#0f172a" />
  <text x="300" y="162" class="lbl-bold">B</text>

  <circle cx="380" cy="140" r="4" fill="#0f172a" />
  <text x="380" y="162" class="lbl-bold">A</text>

  <!-- Dây BC nối từ C(60, 40) đến B(300, 140) nghiêng góc 30 độ -->
  <line x1="60" y1="40" x2="300" y2="140" stroke="#0f172a" stroke-width="2" />
  <path d="M 260 140 A 40 40 0 0 1 268 127" fill="none" stroke="#0f172a" stroke-width="1.2" />
  <text x="240" y="132" font-size="13">30°</text>

  <!-- Lực tập trung P thẳng đứng hướng xuống tại A -->
  <line x1="380" y1="140" x2="380" y2="215" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-red)" />
  <text x="390" y="210" class="lbl-bold" fill="#dc2626">P</text>

  <!-- Sức căng dây T tại B hướng về C -->
  <line x1="300" y1="140" x2="210" y2="102.5" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arr-red)" />
  <text x="240" y="105" class="lbl-bold" fill="#16a34a">T</text>

  <!-- Phản lực liên kết tại bản lề O: Xo, Yo -->
  <line x1="60" y1="140" x2="115" y2="140" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="105" y="132" class="lbl-bold" fill="#2563eb">X<tspan font-size="12">o</tspan></text>
  
  <line x1="60" y1="140" x2="60" y2="85" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="68" y="95" class="lbl-bold" fill="#2563eb">Y<tspan font-size="12">o</tspan></text>

  <!-- Chân đường vuông góc OH hạ từ O xuống dây BC (OH vuông góc BC chuẩn xác 90 độ) -->
  <line x1="60" y1="140" x2="95.5" y2="54.8" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3,3" />
  <polyline points="92.0,63.1 100.3,66.6 103.8,58.3" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="105" y="52" class="lbl-bold" fill="#dc2626">H</text>
  <text x="68" y="105" class="lbl-bold" fill="#dc2626">h</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-sub { font-size: 13px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
    .vec { stroke: #2563eb; stroke-width: 2.2; }
    .axis { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .solid { stroke: #1e293b; stroke-width: 1.8; fill: #f8fafc; }
  </style>

  <!-- Hệ trục tọa độ Oxyz -->
  <line x1="80" y1="210" x2="80" y2="40" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="65" y="40" class="lbl-bold">z</text>
  <line x1="80" y1="210" x2="400" y2="210" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="405" y="215" class="lbl-bold">y</text>
  <line x1="80" y1="210" x2="25" y2="260" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="15" y="270" class="lbl-bold">x</text>
  <text x="65" y="225" class="lbl-bold">O</text>
  
  <!-- Chất điểm M(x, y, z) -->
  <circle cx="260" cy="110" r="6" fill="#3b82f6" />
  <text x="270" y="105" class="lbl-bold">M(x,y,z)</text>
  
  <!-- Vectơ lực F và 3 thành phần Fx, Fy, Fz -->
  <line x1="260" y1="110" x2="350" y2="65" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <text x="355" y="65" class="lbl-bold" fill="#dc2626">F&#8407;</text>
  
  <line x1="260" y1="110" x2="330" y2="110" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="335" y="115" class="lbl">F<tspan font-size="12">y</tspan></text>
  
  <line x1="260" y1="110" x2="260" y2="60" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="245" y="60" class="lbl">F<tspan font-size="12">z</tspan></text>
</svg>
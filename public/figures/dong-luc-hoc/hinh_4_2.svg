<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Trục ren vít thẳng đứng -->
  <rect x="280" y="70" width="40" height="150" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
  <!-- Đường ren xoắn -->
  <line x1="280" y1="90" x2="320" y2="100" stroke="#64748b" stroke-width="2" />
  <line x1="280" y1="110" x2="320" y2="120" stroke="#64748b" stroke-width="2" />
  <line x1="280" y1="130" x2="320" y2="140" stroke="#64748b" stroke-width="2" />
  <line x1="280" y1="150" x2="320" y2="160" stroke="#64748b" stroke-width="2" />
  <line x1="280" y1="170" x2="320" y2="180" stroke="#64748b" stroke-width="2" />
  <line x1="280" y1="190" x2="320" y2="200" stroke="#64748b" stroke-width="2" />

  <!-- Tay vặn dài L gắn ở đầu trên (y = 70) -->
  <line x1="120" y1="70" x2="480" y2="70" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
  <text x="390" y="55" font-family="sans-serif" font-size="13" font-style="italic" fill="#0284c7">L</text>

  <!-- Lực P tác dụng vuông góc lên đầu tay vặn -->
  <line x1="480" y1="70" x2="480" y2="140" stroke="#ef4444" stroke-width="2.8" marker-end="url(#arr-red)" />
  <text x="490" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">P</text>

  <!-- Bàn ép dưới tác dụng lên vật ép (y = 220) -->
  <rect x="250" y="220" width="100" height="20" fill="#64748b" stroke="#0f172a" stroke-width="2" />
  <!-- Vật ép -->
  <rect x="265" y="240" width="70" height="40" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  <text x="300" y="265" font-family="sans-serif" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">Vật ép</text>

  <!-- Lực ép Q thẳng đứng xuống -->
  <line x1="300" y1="280" x2="300" y2="315" stroke="#ef4444" stroke-width="2.8" marker-end="url(#arr-red)" />
  <text x="310" y="305" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">Q</text>

  <!-- Bước ren h -->
  <line x1="335" y1="130" x2="335" y2="150" stroke="#475569" stroke-width="1.5" />
  <text x="345" y="143" font-family="sans-serif" font-size="12" font-style="italic" fill="#475569">h</text>
</svg>
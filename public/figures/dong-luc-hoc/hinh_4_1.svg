<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a" />
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Times New Roman', 'Cambria Math', serif; }
    .lbl { font-size: 18px; font-style: italic; fill: #0f172a; }
    .lbl-bold { font-size: 20px; font-style: italic; font-weight: bold; fill: #0f172a; }
  </style>

  <!-- Vùng đệm bề mặt vật thể có gạch chéo -->
  <path d="M 60 210 Q 220 90, 380 210 L 380 230 L 60 230 Z" fill="url(#hatch)" stroke="#64748b" stroke-width="1.2" />
  
  <!-- Mặt cong liên kết nhẵn, đỉnh tiếp xúc tại đúng (220, 150) -->
  <path d="M 60 210 Q 220 90, 380 210" fill="none" stroke="#1e293b" stroke-width="2.5" />
  
  <!-- Đường tiếp tuyến nét đứt tại M -->
  <line x1="120" y1="150" x2="320" y2="150" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Ký hiệu góc vuông 90 độ chuẩn mực giữa vectơ N thẳng đứng và dr nằm ngang -->
  <polyline points="220,132 238,132 238,150" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="229" cy="141" r="1.5" fill="#0f172a" />
  
  <!-- Vectơ di chuyển khả dĩ dr (tiếp tuyến nằm ngang tại đỉnh M) -->
  <line x1="220" y1="150" x2="330" y2="150" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arr-green)" />
  <g>
    <text x="340" y="156" class="lbl-bold" fill="#16a34a">δr</text>
    <path d="M 350 138 h 10 l -2.5 -2.5 m 2.5 2.5 l -2.5 2.5" fill="none" stroke="#16a34a" stroke-width="1.3" stroke-linecap="round" />
  </g>
  
  <!-- Vectơ phản lực pháp tuyến N (thẳng đứng hướng lên, vuông góc với mặt tiếp xúc) -->
  <line x1="220" y1="150" x2="220" y2="48" stroke="#dc2626" stroke-width="2.8" marker-end="url(#arr-red)" />
  <g>
    <text x="210" y="32" class="lbl-bold" fill="#dc2626">N</text>
    <path d="M 210 14 h 15 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Điểm M đặt chính xác tại tiếp điểm đỉnh mặt cong -->
  <circle cx="220" cy="150" r="5" fill="#2563eb" stroke="#1e293b" stroke-width="1.5" />
  <text x="188" y="142" class="lbl-bold" fill="#0f172a">M</text>
  
  <!-- Công thức công khả dĩ triệt tiêu -->
  <g>
    <text x="140" y="260" class="lbl-bold" fill="#0f172a">δA<tspan font-size="12">N</tspan> = N · δr = 0</text>
    <path d="M 197 242 h 14 l -3 -2.5 m 3 2.5 l -3 2.5" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 235 242 h 10 l -2.5 -2.5 m 2.5 2.5 l -2.5 2.5" fill="none" stroke="#16a34a" stroke-width="1.3" stroke-linecap="round" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Cầu vồng bán kính R: cung tròn tâm O(300, 450), bán kính R=300, đỉnh tại (300, 150) -->
  <path d="M 60 270 A 300 300 0 0 1 540 270" fill="none" stroke="#64748b" stroke-width="4" />
  <!-- Gạch trang trí phía dưới cầu -->
  <path d="M 60 285 A 300 300 0 0 1 540 285" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Tâm cong O -->
  <circle cx="300" cy="450" r="4" fill="#64748b" />
  <line x1="300" y1="150" x2="300" y2="280" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="310" y="220" font-family="sans-serif" font-size="13" font-style="italic" fill="#64748b">R</text>

  <!-- Ô tô tại đỉnh cầu A (300, 150) -->
  <g transform="translate(265, 115)">
    <!-- Thân xe -->
    <rect x="0" y="15" width="70" height="20" rx="4" fill="#0284c7" />
    <path d="M 12 15 L 22 3 L 48 3 L 58 15 Z" fill="#0369a1" />
    <!-- Bánh xe -->
    <circle cx="16" cy="35" r="7" fill="#1e293b" />
    <circle cx="54" cy="35" r="7" fill="#1e293b" />
    <circle cx="16" cy="35" r="3" fill="#f8fafc" />
    <circle cx="54" cy="35" r="3" fill="#f8fafc" />
  </g>
  <circle cx="300" cy="130" r="4" fill="#0f172a" />
  <text x="310" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">A</text>

  <!-- Trọng lực P thẳng đứng xuống -->
  <line x1="300" y1="130" x2="300" y2="230" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="308" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">P = mg</text>

  <!-- Phản lực pháp tuyến N thẳng đứng lên -->
  <line x1="300" y1="130" x2="300" y2="45" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)" />
  <text x="308" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981">N</text>

  <!-- Vận tốc v nằm ngang -->
  <line x1="300" y1="130" x2="390" y2="130" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-blue)" />
  <text x="395" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0284c7">v</text>

  <!-- Gia tốc hướng tâm a_n hướng về O -->
  <line x1="285" y1="130" x2="285" y2="185" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-red)" />
  <text x="235" y="170" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b">a_n = v²/R</text>
</svg>